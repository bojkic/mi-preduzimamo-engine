      kako:
        show:
          eyebrow: "Bodovi zajedništva"
          title: "Kako funkcioniše?"
          subtitle: "Doprinosiš gradu — skupljaš bodove. Evo kako da ih osvojiš i na šta ih potrošiš."
          no_vote_title: Bodovi su priznanje, ne moć # LFBN-COPY-REVIEW
          no_vote_policy: Bodovi zajedništva su samo znak priznanja za tvoj doprinos zajednici. Nemaju novčanu vrijednost i ne mogu se zamijeniti za novac. Nikada ne utiču na glasanje, na rang prijedloga niti na to koliko je neki prijedlog vidljiv. Tvoj glas u participaciji vrijedi jednako kao i glas svakog drugog komšije — bez obzira na broj bodova. # LFBN-COPY-REVIEW
          earn_title: "Kako osvajaš bodove"
          earn_intro: Svaka radnja ima svoju vrijednost i uslove. Tabela prikazuje trenutno važeće bodove i granice broja bodovanih
            radnji.
          volunteer_daily_rule: "Potvrđen rad donosi %{day_points} osnovnih bodova jednom po osobi za svaki kalendarski dan u Sarajevu, bez obzira na sate ili priliku. Prijedlog prilike donosi %{proposal_points} bodova jednom za sve njene termine. Stvarni sati se bilježe; organizacija može zasebno dodijeliti bonus po satu prema ponudi i raspoloživom budžetu."
          verification_note: Volonterski rad boduje se nakon odobrenja rada. Za poziv je dovoljna registracija s potvrđenim telefonom
            i izabranim komšilukom; dodatna objava nije uslov. Rok i mjesečni limit vrijede i za takav poziv.
          daily_limit:
            one: 'najviše %{count} bodovana radnja dnevno'
            few: 'najviše %{count} bodovane radnje dnevno'
            other: 'najviše %{count} bodovanih radnji dnevno'
          levels_title: "Nivoi priznanja"
          levels_intro: "Kako rasteš u doprinosu, rasteš i u zvanju komšiluka."
          from_points: "od %{points} bodova"
          spend_title: "Na šta trošiš bodove"
          spend_intro: "Bodove mijenjaš za simbolične nagrade zajednice."
          spend_policy: "Bodovi su priznanje i stanje novčanika; nemaju novčanu vrijednost, ne kupuju glasove i ne utiču na rang prijedloga."
          reward_fulfillment_note: "Kada preuzmeš nagradu, tim fondacije ručno potvrđuje zalihe, veličinu i termin preuzimanja prije isporuke."
          spend_empty: "Katalog nagrada je trenutno prazan."
          to_wallet: "Moj doprinos"
          to_leaderboard: "Tabla doprinosa"
          to_volunteer: "Volontiranje"
          to_rewards: "Nagrade"
          monthly_limit:
            one: najviše %{count} bodovana radnja mjesečno
            few: najviše %{count} bodovane radnje mjesečno
            other: najviše %{count} bodovanih radnji mjesečno
          period_note: Dan i kalendarski mjesec računaju se po vremenu u Sarajevu. Nakon limita možeš nastaviti da učestvuješ, ali dodatne
            radnje u tom periodu ne donose lične bodove.
          report_rule: Prijava vezana za tvoj nalog nosi %{ordinary} bodova; duplikat ili potvrda „Isti problem” %{duplicate}; odbijena
            prijava 0. Važi ista skala na sajtu i podržanim kanalima. Anonimnost prema službi ne umanjuje bodove. Bez pouzdane veze
            s registrovanim nalogom nema ličnih bodova. Duplikat i potvrda dijele jedan dobitak po osobi i glavnom problemu i dnevni
            limit prijava.
          referral_rule: Poziv preko tvog linka donosi %{points} bodova kada komšija potvrdi telefon i izabere komšiluk, najranije poslije
            %{hours} sata. Najviše %{cap} isplaćenih poziva mjesečno; ostali kvalifikovani čekaju naredni mjesec, redom. Komšija u trci
            doprinosi svom, a ne nužno tvom komšiluku.
          visibility_rule: Javno priznanje je uključeno po početnom podešavanju. Možeš ga isključiti u Moj nalog; tada te nema na javnoj
            tabli i javnim isticanjima. To ne mijenja bodove, nagrade ni rezultat komšiluka. Administratori i aktivni operateri nisu
            u pojedinačnom javnom poretku, ali mogu doprinijeti trci.
          correction_rule: Pri pregledu se bodovi mogu ispraviti zbog duplikata, odbijanja ili uklonjenog sadržaja. U istoriji vidiš
            razlog i promjenu. Ako bi ispravka napravila negativno stanje, tim je prvo razmatra; novčanik se ne spušta ispod nule. Pitanje
            ili prigovor pošalji kroz Kontakt uz broj prijave ili zapis iz istorije.
          measures_title: Koji bodovi se gdje računaju?
          measures:
            wallet: 'Novčanik: bodovi raspoloživi za nagrade. Trošenje i pokloni mijenjaju stanje.'
            contribution: 'Doprinos: priznati doprinos za nivo i javni poredak. Trošenje ga ne umanjuje; ispravke netačnih dodjela mogu
              ga promijeniti.'
            season: 'Sezona: pregled doprinosa od objavljenog datuma. Novi sezonski pregled ne briše novčanik ili ukupni doprinos.'
            race: 'Trka komšiluka: zaseban obračun za komšiluk u vremenu takmičenja. Lični bodovi nisu bodovi trke, niti glasovi u odlučivanju.'
          comparison_title: Lični bodovi i trka
          comparison_headers:
            action: Radnja
            personal: Bodovi zajedništva
            race: Bodovi trke
          comparison:
            registration: Potvrđen telefon i izabran komšiluk
            registration_personal: '%{points}, jednom'
            registration_race: '%{points}, u uslovima trke'
            report: Prihvatljiva prijava vezana za nalog
            report_personal: '%{points}; najviše %{cap} bodovanih radnji dnevno'
            report_race: '%{points}; najviše %{cap} u cijeloj trci'
            duplicate: Duplikat / „Isti problem”
            duplicate_personal: '%{points}; jednom po osobi i glavnom problemu'
            duplicate_race: '0'
            proposal: Objavljen prijedlog građanina
            proposal_personal: '%{points}; najviše %{cap} mjesečno'
            proposal_race: '%{points}; najviše %{cap} u cijeloj trci'
            other: Volontiranje, pozivi, lajkovi i ostale radnje
            other_personal: Prema tabeli i pravilima ispod
            other_race: '0'
          comparison_note: 'Trka dodatno traži potvrđen telefon, prihvatljiv izvor i takmičarski period. Odbijena prijava ne donosi
            bodove. Odbijen prijedlog koji samo nije izabran za realizaciju nije isto što i skriven ili obrisan nedozvoljen sadržaj.
            Puna pravila trke:'
          faq_title: Česta pitanja o bodovima i trci
          faq:
            corrections:
              q: Zašto se broj bodova smanjio?
              a: 'Pogledaj istoriju novčanika: trošenje mijenja raspoloživo stanje, a obrazložena ispravka može promijeniti i doprinos.
                Duplikat vrijedi manje od nove prijave; odbijena prijava ne vrijedi bodove. Prigovor pošalji kroz Kontakt uz konkretan
                zapis.'
            volunteering:
              q: Da li prijava za volontiranje ili potvrđen dolazak nose bodove?
              a: Ne sami po sebi. Boduje se odobren stvarno odrađen rad. Osnovni bodovi su jednom po kalendarskom danu u Sarajevu; sati
                se bilježe zasebno, a eventualni dodatak organizacije zavisi od njene ponude i budžeta.
            moves:
              q: Šta ako promijenim komšiluk?
              a: Možeš promijeniti komšiluk za svakodnevno korišćenje. U ovoj trci doprinos ostaje prvom komšiluku utvrđenom pouzdanim
                zapisom za takmičenje. Preseljenje ne prebacuje ranije bodove, a komšiluk pozivaoca ne određuje komšiluk pozvane osobe.
            ties:
              q: Kako se rješava izjednačenje u trci?
              a: Prvo se poredi ukupan rezultat, zatim broj bodovanih prijava, pa broj bodovanih prijedloga. Potpuno izjednačenje razrješava
                administrator uz zabilježen razlog. Nema automatskog žrijeba ili unaprijed obećanog roka od tri dana.
            projects:
              q: Ko predlaže i bira projekat pobjedničkog komšiluka?
              a: Fondacija otvara poseban proces s jasnim rokovima i prijedlozima. Pravo glasanja provjerava se prema potvrđenom telefonu
                i pripadnosti pobjedničkom komšiluku na presjeku trke. Rokovi se objavljuju kada proces bude spreman; bodovi ne daju
                dodatne glasove.
            closed:
              q: Šta se događa poslije završetka trke?
              a: Zatvaranje prijema bodovanih radnji nije proglašenje pobjednika. Tim pregleda rezultat i objavljuje odobreni konačni
                poredak. Bodovi trke mogu kasnije biti ručno sakriveni; informacije o pobjedniku i projektu ostaju.
            privacy:
              q: Da li anonimna prijava ili skriveno javno priznanje mijenjaju bodove?
              a: Ne. Anonimna prijava znači da kontakt ne prosljeđujemo službi. Ako je pouzdano vezana za registrovan nalog, važe isti
                bodovi. Isključenje javnog priznanja skriva pojedinačno isticanje, ali ne mijenja novčanik i trku.
