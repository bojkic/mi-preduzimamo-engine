        help: |-
          Zdravo, komšija! 👋 Ja sam asistent platforme — tvoj digitalni asistent i prečica do grada. Šta radimo danas?
          📍 Prijavi problem · 💡 Predloži ideju · 💰 Budžet grada · ❤️ Doniraj

          Mogu i da ti pomognem da:
          • pitaš za gradske usluge (npr. „izvod iz matične knjige“, „parking“),
          • saznaš dan odvoza otpada (npr. „odvoz otpada Glavna ulica“),
