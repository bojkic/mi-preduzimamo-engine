          title: Милицина мјерила одговора
          intro: Број забиљежених одговора за завршене дане. Табела и ЦСВ користе
            исте филтере и исти основ за збир.
          limits: Нови и ранији скуп мјерења се преклапају и не смију се сабирати.
            Некласификован саобраћај може обухватати тестирање. Исходи не мјере корисност,
            тачност, јединствене грађане или сесије. Ранија ревизија означава код
            при збирном упису; нова означава код при покретању процеса. Недостајући
            записи не доказују одсуство питања. Ранији бројачи били су за цијелу платформу
            и приписани организацији при збирном упису; нови бројачи су раздвојени
            по организацији.
          period: Завршени дани
