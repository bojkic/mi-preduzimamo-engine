        prior_evidence_private_unavailable: "Ne mogu sigurno prikazati ranije informacije s ploče susjedstva bez trenutne provjere pristupa."
        prior_evidence_disagreement: "Hvala što si navela drukčije stanje. To ne mijenja izvor ni objavu; možeš provjeriti ili prijaviti stanje ovdje: %{url}"
        prior_evidence_observed_at: "Sačuvani datum zapažanja: %{time}"
        prior_evidence_checked_at: "Sačuvano vrijeme provjere izvora: %{time}"
        prior_evidence_requested_window: "Traženi datum ili period: %{time}"
        prior_evidence_fact_label: "Podatak %{index} (%{source})"
        prior_evidence_fact_validity: "%{fact} — važenje: %{time}"
        prior_evidence_fact_validity_unknown: "%{fact} — važenje nije potvrđeno."
        prior_evidence_fact_observed_at: "%{fact} — datum zapažanja: %{time}"
        prior_evidence_fact_checked_at: "%{fact} — vrijeme provjere izvora: %{time}"
        prior_evidence_current_member_source: "Trenutno ovlašteno čitanje ploče navodi izvor: %{source}"
        prior_evidence_current_member_read: "Ovo je trenutno ovlašteno čitanje ploče komšiluka."
        report_handoff: "Prijavu možeš završiti u zvaničnom obrascu: %{url}\nNišta još nije poslano. Opis, mjesto i priloge unesi i potvrdi u obrascu; razgovor ih ne prenosi automatski."
        duplicate_unavailable: "Nisam mogla pouzdano provjeriti slične prijave u blizini."
        board_handoff: "Objavu za komšiluk možeš pripremiti na tabli: %{url}\nOvdje ništa nije objavljeno. Tabla provjerava pristup i traži potvrdu objave."
        handoff_unavailable: "Ovaj korak trenutno nema podržanu vezu iz razgovora. Provjeri mogućnosti naloga: %{url}"
        account_observed: "Prema trenutnom stanju tvog naloga, ovaj korak je već završen. Nalog: %{url}"
        handoff_register: "Hajde da otvorimo nalog — traje minut: %{url}\nKad završiš, vrati se u razgovor; sačuvala sam gdje smo stali."
        handoff_sign_in: "Prijavi se na postojeći nalog ovdje: %{url}"
        handoff_verify: "Potvrdu naloga nastavi na zvaničnoj stranici: %{url}\nKod nemoj slati u razgovor."
        handoff_choose_area: "Izbor svog komšiluka nastavi ovdje: %{url}\nMjesto spomenuto u razgovoru ne mijenja tvoj profil."
        handoff_manage_preferences: "Obavještenja možeš podesiti ovdje: %{url}\nU razgovoru nisam promijenila tvoje postavke."
        handoff_next_step: "Podržani sljedeći korak je ovdje: %{url}"
        account_help_clarify: "Treba li ti otvaranje naloga, prijava, potvrda naloga ili objašnjenje uslova registracije?"
        registration_terms_information: "Polje za uslove nalazi se na obrascu za registraciju, uz vezu za čitanje uslova. Prihvatanje uslova je obavezno; primanje novosti je dobrovoljno. Saglasnost se ne daje u razgovoru. Podržani sljedeći korak: %{url}"
        registration_newsletter_information: "Ovaj izbor uključuje obavještenja o tvojim prijavama, zajednici, platformi i komšiluku. Platforma bira kanal za dostavu. Unaprijed je uključen; ako ga isključiš, sve četiri teme počinju isključene, a obavještenja ostaju dostupna na platformi. Teme kasnije možeš promijeniti u podešavanjima. Izbor je dobrovoljan i odvojen od obaveznih uslova registracije. U razgovoru nisam promijenila tvoje postavke. %{url}"
        registration_phone_information: "Pri registraciji telefonom, broj služi za potvrdu pristupa i kasniju prijavu. Unesi ga u obrazac; kod ili vezu iz poruke koristi u postupku potvrde, ne u ovom razgovoru. Ovdje nisam poslala kod niti potvrdila nalog. Podržani sljedeći korak: %{url}"
        resume_manual: "Automatski povratak sa sačuvanim nacrtom nije podržan. Nakon obrasca vrati se u razgovor; ako se nalog promijeni, radi privatnosti ponovo navedi prethodno pitanje."
        resume_offer: "Sačuvala sam i prethodno ili dodatno pitanje u ovom razgovoru. Napiši „nastavi” da pređemo na njega."
        greeting: "Ćao! Ja sam Komšinica Milica. Ti objasni ljudski, ja ću prevesti na formularski. Od čega krećemo: rupa, autobus, odvoz, budžet ili nalog?"
        thanks: "Nema na čemu. Ako još nešto zapne, tu sam."
        farewell: "Ćao! Navrati kad god nešto zapne."
        capabilities: "Ne treba ti naziv odjeljenja ni broj kancelarije. Reci ljudski šta ti treba: prijava problema, status, gradska usluga, odvoz otpada, parking, autobus, budžet, Službeni glasnik, tvoj Komšiluk, ideja, glasanje, volontiranje, bodovi ili projekti. Ja ću pohvatati konce."
        resume_nothing: "Nemam sačuvano pitanje. Šta te zanima?"
        provider_unavailable: "Moj pomoćnik za razumijevanje trenutno ne odgovara. Sačuvala sam gdje smo stali — pokušaj ponovo za minut."
        facts_in_source_language: "Podaci su navedeni na jeziku izvora."
        more_items: "Prikaz: %{shown}/%{total}. Za cijeli spisak napiši „više“ ili otvori poveznicu iznad."
        unsupported_topic: "Za ovu temu još nemam provjeren izvor, pa ne bih pogađala. Najbliži siguran korak: %{next_step}"
        # --- Task 3b: reviewed public-information cards (deterministic, model-free)
        civic_vote_integrity: "Ne. Bodovi zajedništva su priznanje, ne moć: ne utiču na glasanje, na rang prijedloga ni na vidljivost sadržaja. Glasanje je jedan građanin — jedan glas, bez obzira na bodove, donacije ili poredak u trci komšiluka. Trka broji registracije, prijave i prijedloge samo radi nagrade komšiluku i ne mijenja ni jedan glas. Sva pravila: %{url}"
        civic_privacy: "Šta se radi s tvojim podacima ne izmišljam — piše u objavljenoj politici privatnosti: %{url}. Tamo stoji ko je rukovalac (%{name}), koji se podaci obrađuju i po kom osnovu, koliko se čuvaju, kome se prosljeđuju i koja su tvoja prava. Ono što sam objaviš — prijedlog, komentar, glas, prijava — javno je na platformi. Za pristup, ispravku ili brisanje svojih podataka piši na %{email}."
        civic_newcomer: "MI PRE(D)UZIMAMO! je građanska platforma koju vodi %{name}. Četiri stvari radiš ovdje: prijaviš komunalni problem i vidiš kome je otišao; daš prijedlog i glasaš o tome šta se radi; pratiš svoj komšiluk i mjesnu zajednicu; i pitaš me za gradske usluge i servisne informacije. Za doprinos dobijaš bodove zajedništva — priznanje, ne moć. Odakle krećemo?"
        civic_newcomer_chip_report: "Prijavi problem"
        civic_newcomer_chip_komsiluk: "Moj komšiluk"
        civic_newcomer_chip_points: "Bodovi zajedništva"
        launch_invitation_confirmation: "Potvrda dolaska je molba, ne uslov za ulaz. Ako ne potvrdiš, pozivnica ne propada i na ulazu te propuštamo — samo pokaži broj rezervacije. Link za potvrdu jednim dodirom radi 72 sata od poruke; poslije toga potvrdu ne možeš poslati, ali pozivnica i dalje važi."
        launch_invitation_deadline: "Pravo na pozivnicu stičeš kad skupiš 20 bodova zajedništva, najkasnije 16.9.2026. u 23:59. Trka komšiluka traje do 14.10.2026. — to je drugi rok i sa pozivnicom nema veze."
        launch_invitation_eligibility: "Pozivnica se ne dijeli na vratima i ne dobija se ranijim dolaskom. Treba ti nalog na platformi sa potvrđenim brojem telefona i izabranim komšilukom — to je 20 bodova i pozivnica stiže porukom. Sama adresa e-pošte, bez potvrđenog broja telefona, nije dovoljna."
        launch_invitation_not_spent: "Bodovi se ne oduzimaju kad dobiješ pozivnicu — 20 bodova je prag, ne cijena. Ostaju ti na računu i kasnije ih možeš potrošiti na nagrade iz kataloga."
        race_overview: "Trka komšiluka traje od 6.9. do 14.10.2026. u 20:00. Boduje se: registrovani × 1 + prijave × 2 + prijedlozi × 3, i to komšiluku autora, ne komšiluku u kojem je problem. Od jedne osobe računa se najviše 5 prijava i 3 prijedloga. Poredak: %{url}"
        race_prize: "Dva komšiluka dobijaju po 3.000 KM — jedan gradski i jedan seoski. Šta se gradi bira sam komšiluk, glasanjem na platformi krajem oktobra."
        foundation_contact: "%{name} — %{address}. Mejl: %{email}. Sajt: %{url}"
        foundation_contact_minimal: "%{name} — kontakt mejl: %{email}"
        foundation_phone_unknown: "Javni broj telefona nije objavljen, pa ga ne bih pogađala."
        foundation_phone_not_city: "Broj gradske centrale koji se nađe na internetu pripada Gradskoj upravi — to je druga organizacija."
        # --- R5/R6: who runs and funds the platform, what Milica can do, where a proposal goes
        civic_platform_operator: "Ovu platformu vodi %{name}. Korištenje je besplatno: ni registracija, ni prijava problema, ni prijedlog ni glasanje se ne naplaćuju. Bodovi zajedništva nemaju novčanu vrijednost."
        civic_funding: "Korištenje platforme ne plaćaš ti — besplatna je. %{statement}"
        civic_identity: "Ovaj razgovor te ne prepoznaje sam od sebe. Ako nisi prijavljen ili prijavljena, o tebi ne znam ništa — ni ime, ni broj telefona, ni komšiluk. Kad se prijaviš, pokazujem ti samo ono što pripada tvom nalogu i samo kad to zatražiš. Prijava: %{url}"
        civic_chat_messaging: "Ne. Iz ovog razgovora ne šaljem SMS, Viber ni e-poštu i nisam ti ništa poslala. Poruku s vezom i kodom šalje sam postupak potvrde broja — novo slanje tražiš na stranici koja čeka potvrdu. Kod nikad ne upisuj u razgovor."
        civic_phone_change: "Broj telefona ti odavde ne mogu promijeniti — u razgovoru ne mijenjam ništa na nalogu. Dok broj još nije potvrđen, mijenjaš ga na stranici koja čeka potvrdu, i to samo u pregledniku u kojem si se registrovao ili registrovala. Ako je broj već potvrđen, piši na %{email}."
        civic_proposal_route: "Prijedlog ne predaješ meni u razgovoru nego na platformi, i za to ti ne treba organizacija — dovoljan je tvoj nalog. Prijedloge građana otvaraš ovdje: %{url}"
        goodwill_referral: 'Poziv preko tvog linka nosi %{points} uz potvrđen telefon i izabran komšiluk. Najranije poslije %{hours}
          sata; najviše %{cap} isplaćenih poziva mjesečno. Višak kvalifikovanih poziva prelazi u naredni mjesec redom. Pravila: %{url}'
        goodwill_referral_pending: Tuđe privatne podatke ne mogu pogledati. Poziv može čekati potvrdu telefona, izbor komšiluka, odgodu
          od %{hours} sata ili naredni mjesec zbog limita. Samo istek odgode ne znači da su svi uslovi ispunjeni.
        goodwill_daily_cap: "Dnevna granica važi samo za bodove, nikada za samu radnju: prijava se pošalje, komentar se objavi, glas se izbroji — tog dana samo više ne nose bodove. Dnevne granice: %{caps}. Sva pravila: %{url}"
        race_standings_intro: "Trka komšiluka — trenutni poredak:"
        race_standings_zone_grad: "Gradski komšiluci"
        race_standings_zone_selo: "Seoski komšiluci"
        race_standings_leader: "%{zone}: vodi %{name}, rezultat %{score}"
        race_standings_no_leader: "%{zone}: još nema rezultata"
        race_standings_observed: "Stanje poretka: %{time}. Cijela tabela: %{url}"
        race_standings_unknown_time: "Vrijeme posljednjeg računanja poretka nije zabilježeno, pa ovo ne prikazujem kao trenutno stanje. Cijela tabela: %{url}"
        race_standings_final: "Poredak je zaključen i više se ne mijenja. Cijela tabela: %{url}"
        race_standings_unavailable: "Trenutni poredak trke sada ne mogu pročitati, pa ne bih navodila brojeve. Tabela je ovdje: %{url}"
        # --- Task 5: the account journeys, one answer per journey
        account_help_chip_register: "Otvaranje naloga"
        account_help_chip_sign_in: "Prijava na postojeći nalog"
        account_help_chip_verify: "Potvrda broja telefona"
        account_help_chip_terms: "Uslovi registracije"
        clarify_chip_report: "Želim prijaviti problem"
        clarify_chip_account: "Pomoć s nalogom"
        clarify_chip_service: "Kada se odvozi smeće?"
        clarify_chip_neighborhood: "Šta ima novo u mom komšiluku?"
        account_verification_lifetime: "Veza za potvrdu naloga i kod iz poruke važe 24 sata; veza za prijavu bez lozinke važi 10 minuta. Nova poruka poništava prethodnu vezu i kod, ali ne resetuje broj pogrešnih pokušaja. Poslije pet pogrešnih unosa sačekaj da prođu 24 sata od prvog pogrešnog pokušaja ili koristi važeću vezu iz poruke. Nastavi ovdje: %{url}"
        account_code_entry: "Ne treba ti pametni telefon. U poruci stiže i veza za jedan dodir i kod koji možeš prepisati. Na stranici za potvrdu i na stranici koja čeka potvrdu uvijek stoji polje „Imam kod iz SMS-a“ — tu unesi kod. U ovaj razgovor kod nemoj slati. Nastavi ovdje: %{url}"
        account_message_missing: "Ako poruka nije stigla: provjeri broj, sačekaj minut i zatraži novo slanje na stranici koja čeka potvrdu. Viber nosi samo vezu, a SMS nosi i vezu i kod, pa SMS radi i bez Vibera i WhatsAppa. Novo slanje poništava prethodnu vezu i kod. Ja odavde ne šaljem poruke ni kodove. Nastavi ovdje: %{url}"
        account_email_requirement: "Adresa e-pošte se traži na obrascu, ali ona ne potvrđuje nalog — nalog potvrđuje broj telefona. E-pošta služi za povrat pristupa i obavještenja, a dok je ne potvrdiš, lozinku preko nje ne možeš resetovati. Nastavi ovdje: %{url}"
        account_postal_difference: "To su dva različita koraka. Registracija i potvrda broja telefona otvaraju nalog i dovoljne su za sve na platformi. Potvrda adrese pismom je poseban korak: pismo stiže na kućnu adresu, a kod iz pisma važi 30 dana. Nije uslov za nalog. Nastavi ovdje: %{url}"
        account_residency: 'Nalog može otvoriti svako; izbor komšiluka sam po sebi nije provjera prebivališta. Registracija čuva telefon
          i izabrani komšiluk. Ako tražiš provjeru adrese pismom, adresa se privremeno obrađuje za taj postupak. Nastavi ovdje: %{url}'
        account_phone_visibility: "Tvoj broj telefona nije javan: ne stoji uz prijavu, uz prijedlog ni na tabli komšiluka i drugi građani ga ne vide. Broj služi za potvrdu naloga i za prijavu na nalog. Kad prijaviš problem sa svog naloga, kontakt ide samo nadležnoj službi da bi mogla da te pita za detalje — ne objavljuje se. Nalog: %{url}"
        account_deletion: "Brisanje naloga tražiš na stranici svog naloga, u dijelu za brisanje naloga — ja odavde ništa ne brišem i nisam ništa obrisala. Ono što si već javno objavio ili objavila ne nestaje samim brisanjem naloga; ako ti smeta neka objava, reci koja. Nalog: %{url}"
        account_settings: "Postavke su na stranici tvog naloga: tamo mijenjaš ime, lozinku, jezik, obavještenja i komšiluk. U razgovoru ti ništa nisam promijenila. Nalog: %{url}"
        account_sign_out: "Odjava je u meniju naloga, gore desno — „Odjavi se“. Na zajedničkom računaru poslije odjave zatvori i prozor pregledača, a sljedeći put otvori privatni prozor. Ja te odavde ne mogu odjaviti. Nalog: %{url}"
        account_required_fields: "Na obrascu se traže ime ili nadimak, adresa e-pošte, broj telefona koji potvrđuješ porukom i izbor komšiluka, uz prihvatanje uslova. Primanje novosti je dobrovoljno. Sve to upisuješ u obrazac, ne u ovaj razgovor. Nastavi ovdje: %{url}"
        account_registration_award: "Registracija nosi %{points} bodova zajedništva: %{verification} za potvrđen broj telefona i %{area} za izabran komšiluk. Drugog uslova nema — ali sam obrazac, bez potvrde broja, još ne nosi ništa. Bodovi su priznanje, a ne moć: ne utiču na glasanje. Nastavi ovdje: %{url}"
        account_already_registered: "Ne moraš ponovo — nalog ti je već otvoren i prijavljen ili prijavljena si. Nastavi tamo gdje si stao ili stala. Nalog: %{url}"
        # --- Task 5: what a citizen asks ABOUT a report
        report_visibility: 'Evo ko šta vidi. %{public} %{private} Ime prijavioca nije javno prikazano; ovlašteni operateri mogu vidjeti
          povezan nalog. Anonimna prijava ne prosljeđuje kontakt službi. Sve prijave: %{url}'
        report_address_privacy: 'Adresa problema je javna i tačka na mapi stoji tamo gdje je označiš; to može otkriti i kućnu lokaciju.
          Registracija ne traži kućnu adresu, ali provjera pismom je zaseban postupak s privremenom obradom adrese. Označi tačnu lokaciju
          problema bez nepotrebnih privatnih podataka. Obrazac: %{url}'
        report_anonymity: 'Možeš prijaviti anonimno prema službi: kontakt se ne prosljeđuje. Ime prijavioca nije javno ni za jednu
          prijavu. Pouzdano pripisana prijava registrovanom nalogu zadržava iste bodove: obična prijava, duplikat i odbijanje imaju
          svoja pravila i limite. Bez veze s registrovanim nalogom nema ličnih bodova. Obrazac: %{url}'
        report_photo: "Fotografija se prilaže u obrascu za prijavu: polje „Fotografija problema“ prima PNG, JPEG ili WebP do 5 MB i nije obavezno. Fotografija nije javna — vide je samo ovlašteni operateri i služba kojoj prijava ide. Slikaj sam problem, izbliza i iz daljine. Obrazac: %{url}"
        report_duplicate: 'Ako je isti problem već prijavljen, koristi dugme „Isti problem — dodaj potvrdu“ kad ga obrazac ponudi.
          Potvrda povećava javni broj pogođenih građana. Pouzdano povezan registrovani nalog koji ispunjava uslove dobija 5 ličnih
          bodova jednom po istom problemu, unutar zajedničkog dnevnog limita prijava; za trku 0. Veza s nalogom je privatna. Potvrda
          nije pretplata na obavještenja i ne daje službi kontakt. Sačuvaj broj glavne prijave: %{url}'
        report_guidance_only: "Slanje linka i uputstva ne podnosi prijavu niti potvrđuje da je stigla gradu. Za podnošenje popuni i pošalji obrazac: %{url}. Ako si ga već poslao, provjeri potvrdu i status svoje prijave."
        report_forwarding: "Ne automatski. Prijava prvo dobije broj i status „Primljeno“ — to znači da je stigla nama, ne gradu. Operater je pregleda i proslijedi nadležnoj službi, i tek tada status postaje „Poslato službi“. Taj status je jedini pouzdan znak da je prosljeđivanje prihvaćeno, a vidiš ga na stranici svoje prijave: %{url}"
        report_resolution_time: "Ne. „Sistem 48“ je obećanje grada da će na prijavu odgovoriti u roku od 48 sati — odgovor, ne popravka. Rok za samo rješavanje ne obećavamo i ja ga ne znam: zavisi od službe i vrste kvara. Ono što možeš pratiti je status prijave, od „Primljeno“ do „Riješeno“: %{url}"
        report_sistem48_overview: "„Sistem 48“ je gradski sistem za prijave komunalnih problema i odgovor nadležne službe. Rok od 48 sati odnosi se na odgovor, ne popravka. Popravka u tom roku nije garantovana. Na platformi možeš pratiti status prijave: %{url}"
        transport_shorten_question: "Pitanje je predugo za ovu pretragu. Napiši polazno stajalište, odredište i dan ili vrijeme putovanja."
        transport_different_destination: "Polazno i dolazno stajalište su ista. Do kojeg drugog stajališta želiš putovati?"
        transport_choose_stop: "Na koje stajalište misliš: %{choices}?"
        transport_no_feasible_journey: "U pregledanim redovima vožnje nisam pronašla odgovarajuću direktnu ili povezanu vožnju za ta stajališta i vrijeme. To ne isključuje druge mogućnosti izvan obuhvata pretrage. Napiši drugo vrijeme ili polazno stajalište da provjerim ponovo."
        transport_no_published_departures: "U pregledanom redu vožnje nema objavljenih polazaka za traženi dan. To nije potvrda da autobus uopšte ne saobraća. Napiši drugi dan da provjerim objavljene polaske."
        transport_search_limits: "Presjedanja: najviše %{maximum_transfers}; vrijeme za presjedanje: najmanje %{minimum_transfer_minutes} min; čekanje: najviše %{maximum_transfer_wait_minutes} min."
        transport_calendar_conflict: "Datum i traženi školski ili praznični režim se ne poklapaju. Želiš li polaske za navedeni datum ili za drugi dan?"
        report_own: "Ne mogu te identifikovati samo iz chata. Ako je prijava poslana sa naloga, prijavi se i otvori svoje prijave. Za anonimnu prijavu sačuvaj potvrdu: privatni link daje privatni status, a referenca na %{url} samo javni status. Bez potvrde ili pristupa nalogu ne mogu provjeriti privatne detalje."
        report_public_map: "Sve prijave su javne: spisak je ovdje %{list}, a karta sa tačkama ovdje %{map}. Na karti i u spisku stoje broj prijave, kategorija, adresa, status i datum; opis, fotografija i kontakt nisu javni."
        report_scope: "Prijava ovdje ide gradskoj službi i tiče se javnog prostora i komunalnih problema — rupa, rasvjeta, smeće, voda, ali i buka sa gradilišta ili iz ugostiteljskog objekta, što je sasvim uredna prijava. Spor sa komšijom, imovinski spor ili nešto što je krivično djelo ne rješava komunalna služba: za to su komunalna policija, inspekcija ili policija. Ako je neko u opasnosti, zovi 122. Obrazac: %{url}"
        report_limits: 'Limit ograničava bodove, ne podnošenje: dodatna prijava se zavodi i ide na pregled, bez novih bodova nakon
          limita. Predaja službi je zaseban korak poslije pregleda. Ako tehnička zaštita zaustavi prebrzo slanje, sačekaj pa pokušaj
          ponovo. Obrazac: %{url}'
        own_reports_empty: "Na tvom nalogu još nema nijedne prijave. Prijave poslane bez naloga se ne vezuju za nalog, pa za njih čuvaj broj prijave. Novu prijavu otvaraš ovdje: %{url}"
sr-Cyrl:
  decidim:
    bih:
      dialogue:
        transport_calendar_date_needed: Да, напиши тачан датум путовања. Тада могу провјерити објављени календар за ту линију;
          сам назив празника није потврда полазака.
        transport_service_kind_choose_stop: 'Још немам потврђен полазак па не могу потврдити да ли је школски или редовни.
          Прво изабери полазно стајалиште: %{choices}.'
        ask_transport_destination: До којег стајалишта или мјеста путујеш?
        civic_location_help: ГПС није обавезан. Можеш написати улицу, насеље или јавни оријентир; то само по себи не одређује
          коју услугу тражиш. За шта желиш користити ту локацију?
        closure: У реду.
        civic_vote_without_points: 'Да — бодови нису услов за гласање и не повећавају тежину гласа. Једна особа има један
          глас; остали услови учешћа зависе од конкретног процеса гласања. Правила: %{url}'
        civic_race_scope: Разумијем — остајемо на правилима трке комшилука.
        report_own_recovery: 'Разумијем, тражиш постојећу пријаву, не нову. Не могу те идентификовати само из цхата. Ако је
          пријава послана са налога, пријави се и отвори своје пријаве. За анонимну пријаву сачувај потврду: приватни линк
          даје приватни статус, а референца на %{url} само јавни статус. Без потврде или приступа налогу не могу провјерити
          приватне детаље.'
        trusted_channel_web: Ово је web разговор на платформи МИ; назив друге апликације у поруци не мијења канал.
        trusted_channel_unknown: Канал одређује апликација која је доставила поруку, не назив апликације написан у тексту.
          Из доступног техничког контекста овдје не могу потврдити назив канала.
        trusted_account_present: За ову сесију платформа је потврдила приступ МИ налогу. Име на Фацебооку или тврдња у поруци
          нису доказ идентитета; овим одговором нисам повезала ниједан додатни налог нити потврдила број телефона.
        trusted_account_absent: У овој сесији немам потврђен приступ твом МИ налогу. То не значи да налог не постоји; провјери
          га кроз пријаву на платформу. Име на Фацебооку није доказ налога и овим разговором га нисам повезала.
        transport_transfer_missed: 'Ако су оба времена истог дана, не: први долази у %{arrival}, а други одлази у %{departure},
          прије твог доласка. Ово пореди само наведена времена; не потврђује стварне поласке нити резервну везу.'
        transport_transfer_gap: 'Између наведених времена је %{minutes} минута. То није потврда да можеш пресјести: треба
          провјерити стварне поласке, удаљеност стајалишта и безбједан пјешачки прелаз.'
        transport_crossing_unknown: Стајалишта преко пута улице сама по себи не потврђују пресједање. Немам провјерен пјешачки
          прелаз ни вријеме потребно за прелазак. За провјеру везе требају тачна стајалишта и потврђени поласци.
        transport_distance_not_walk: Не. Ваздушна удаљеност је права линија, а ходање прати улице и прелазе. Пјешачки пут
          може бити дужи; мапа није потврда да су тротоари и прелази приступачни.
        transport_absence_not_service: 'Тачно: недостатак провјереног реда вожње није доказ да аутобуси не возе. За тај датум
          треба потврдити распоред код превозника.'
        transport_location_optional: ГПС није обавезан. Можеш написати улицу, насеље или јавни оријентир и навести до којег
          стајалишта желиш доћи. Без тих података не могу поуздано одредити мјесто за улазак.
        transport_boarding_unresolved: Тачно мјесто уласка могу одредити тек када разјаснимо одакле крећеш.
        ask_navigation_stop: Упутство могу написати овдје; нисам послала поруку на други канал. До којег тачно аутобусног
          стајалишта желиш доћи? Напиши његов назив; ГПС није обавезан.
        ask_navigation_stop_again: Разумијем, упутство пишем овдје. Још ми треба назив стајалишта до којег желиш доћи; можеш
          написати и насеље и оближњу улицу.
        civic_feedback_description: Да. Напиши шта је погрешно и шта треба провјерити. Тиме настављамо исправку одговора;
          текст сам не биљежи оцјену „Није корисно“.
        report_form_link: Директан линк до обрасца је %{url} — можеш га отворити у прегледнику. Пријава још није послата;
          отварање линка само отвара образац.
        read_only_question: Разумијем — провјеравамо информације; овим разговором не подносим пријаву.
        transport_verified_only: Могу потврдити само поласке и везе које постоје у објављеном реду вожње. Непотврђену везу
          или ноћну линију нећу представљати као доступан пут.
        supplied_stop_unresolved: Не могу поуздано пронаћи полазно стајалиште „%{stop}“ у објављеном реду вожње. Напиши назив
          регистрованог стајалишта или насеље и оближњу улицу.
        supplied_area_unresolved: Не могу поуздано повезати „%{area}“ с подручјем из извора. Напиши назив насеља и улицу или
          исправи назив мјеста.
        civic_feedback_privacy: Оцјену и ограничен текст питања и одговора могу прегледати овлашћене особе које унапређују
          Милицу. Клик допушта тај приватни преглед, уз заштиту осјетљивог текста; садржај се не објављује јавно и оцјена
          се не повезује с твојим налогом. У поруци ипак могу бити лични подаци које сам напишеш.
        civic_feedback_points: Клик на „Корисно“ или „Није корисно“ не доноси бодове. То је добровољна оцјена одговора Милице,
          без награде и без повезивања с налогом.
        civic_feedback_change: У садашњем web разговору послије успјешно послате оцјене оба дугмета су онемогућена, па ту
          оцјену не можеш промијенити другим кликом. Можеш написати шта треба исправити; та порука није нова оцјена. Ако слање
          није успјело, дугмад поново допуштају покушај.
        civic_feedback_typed: Порука „корисно“ или „није корисно“ у цхату сама не чува оцјену. Оцјена се биљежи тек успјешним
          кликом на доступно дугме. Текстом можеш објаснити грешку и наставити исправку одговора.
        civic_feedback_deletion: Оцјена „Није корисно“ не брише претходну поруку. Она оцјењује колико је одговор Милице помогао;
          клик допушта приватни преглед ограниченог питања и одговора, уз заштиту осјетљивог текста.
        civic_feedback_report: „Корисно“ и „Није корисно“ оцјењују одговор Милице. Не подносе пријаву граду, не мијењају статус
          пријаве и не значе да је комунални проблем ријешен. Одговор може помоћи и док проблем још постоји.
        civic_feedback_account: Оцјењивање одговора не отвара налог и не повезује оцјену с налогом. Оцјена се биљежи доступним
          дугметом; сама порука у разговору није потврда да је клик успјешно сачуван.
        civic_feedback_target: Оцјењујеш корисност конкретног одговора Милице, не рад градске службе. „Корисно“ значи да је
          одговор помогао, а „Није корисно“ да га треба поправити.
        civic_feedback_repair: Напиши који дио одговора је нетачан и који податак треба исправити, па можемо наставити провјеру.
          Ако је доступно дугме „Није корисно“, можеш њиме послати оцјену за приватни преглед; сама текстуална исправка није
          клик нити регистрација.
        report_sistem48_comparison: 'МИ је платформа на којој можеш припремити пријаву и пратити њен статус. Систем 48 је
          градски систем којем надлежна служба одговара на комуналне пријаве; одговор Милице сам не шаље пријаву граду. Стварно
          просљеђивање мора бити потврђено статусом пријаве: %{url}'
        report_responsibility: 'Комунални проблем рјешава надлежна градска служба, а МИ помаже да припремиш и пратиш пријаву;
          тачна надлежност зависи од врсте проблема и локације. Овдје нисам ништа послала и не могу обећати датум одговора:
          %{url}'
        civic_vote_integrity_brief: 'Једна особа има један глас: бодови и донације не повећавају тежину гласа, ранг ни видљивост
          приједлога. Правила: %{url}'
        transport_via_required: Задржавам полазиште %{origin} и крајње одредиште %{destination}. Не могу потврдити пут преко
          %{via}. Које тачно међустајалиште желиш користити?
        transport_choose_stop_again: 'Још није одређено стајалиште за овај пут. Изабери један тачан назив: %{choices}.'
        ask_stop_again: За провјеру поласка још ми треба полазно стајалиште. Напиши његов назив или оближњу улицу; тренутна
          локација није обавезна.
        ask_area_query_again: Још не могу одредити подручје за провјеру. Напиши назив насеља или улице коју желиш провјерити.
        transport_location_alternatives: ГПС није обавезан. Напиши почетну улицу, раскрсницу или јавни оријентир; можеш навести
          и назив стајалишта. Настављамо тражење аутобуске везе без дијељења тренутне локације.
        parking_sign_details: Са паркинг знака препиши ознаку или боју зоне и СМС број, ако су наведени. Без тих података
          не могу потврдити коју зону треба платити.
        regular_waste_location: За распоред редовног одвоза напиши улицу или насеље. Настављамо тражење распореда; не покрећем
          пријаву проблема.
        transport_live_status_unavailable: Немам праћење возила уживо ни потврду кашњења. Ред вожње је план полазака, па из
          њега не могу потврдити гдје је аутобус ни када ће стварно стићи.
        transport_accessibility_unverified: Немам провјерене податке о спуштеним ивичњацима, приступу без степеница ни приступачности
          возила. Близина стајалишта не потврђује приступачну путању; прије пута провјери услове с превозником.
        catalog_empty_volunteer: Не налазим одговарајуће јавно објављене волонтерске активности у доступном каталогу.
        catalog_empty_participation: Не налазим одговарајуће јавно објављене активности учешћа у доступном каталогу.
        catalog_empty_scope_unavailable: Из доступног јавног каталога не могу поуздано издвојити активности за ово подручје.
        catalog_requested_areas: 'Изабрано подручје: %{areas}.'
        catalog_area_mz: МЗ %{name}
        catalog_area_komsiluk: Комшилук %{name}
        catalog_requested_date: 'Тражени датум: %{date} (%{timezone}).'
        catalog_requested_range: 'Тражени период: %{from} – %{through} (%{timezone}).'
        catalog_empty_limit: То што нема одговарајућих објава у каталогу не значи да се активности не одржавају.
        service_contact_unavailable: У прегледаним подацима за %{title} немам контакт телефон службе. Контакт провјери на
          наведеној званичној страници.
        service_official_page: Прегледани извор за %{title} наводи ову званичну страницу.
        procedure_fee_check: За %{title}, цијену и упутство за плаћање провјери на службеној страници наведеној испод.
        procedure_fee_amount: 'Административна такса према прегледаном извору: %{amount} КМ.'
        procedure_fee_unknown: Тачан износ административне таксе није наведен у доступним подацима.
        procedure_postage_unknown: Поштарина се плаћа према упутству службе; њен износ није наведен у доступним подацима.
        procedure_postage_amount: 'Поштарина према прегледаном извору: %{amount} КМ.'
        supplied_area_choice: 'За „%{area}“ имам више подручја: %{choices}. Које мислиш? Ово не мијења твој профил.'
        area_choice_pair: комшилук %{komsiluk} или мјесна заједница %{mz}
        read_warning_operator_correction: Оператор је прегледао и исправио податке о врсти, времену или подручју. Ове исправке
          су одвојене од изворног текста обавјештења.
        read_warning_conflicting_facts: Важећи наводи извора се не слажу. Не могу потврдити који је тачан; провјерите оба
          цитирана обавјештења код надлежне службе.
        fact_observed_at: 'Вријеме мјерења или запажања: %{time}'
        fact_reviewed_on: 'Садржај провјерен: %{time}'
        fact_service_day: 'Датум на који се обавјештење односи: %{time}'
        read_warning_date_only: Извор наводи датум; тачни сати почетка и завршетка нису потврђени.
        read_warning_planned_end: Планирани термин је завршен; то није потврда да је услуга обновљена.
        fact_source_published_at: 'Извор објавио: %{time}'
        fact_source_updated_at: 'Извор измијенио: %{time}'
        fact_starts_at: 'Почетак важења: %{time}'
        fact_ends_at: 'Крај важења: %{time}'
        fact_valid_until: 'Рок: %{time}'
        read_warning_observation_scope: Ово је податак за локацију коју наводи извор, не потврда стања у сваком комшилуку.
        read_warning_area_scope: Извор нема потврђену покривеност за тражено подручје.
        read_warning_observation_time_unknown: Вријеме мјерења није потврђено; ново преузимање не значи ново мјерење.
        read_warning_old_measurement: Мјерење је старије од рока свјежине извора.
        read_warning_no_forecast: Припремљени подаци не садрже тражену прогнозу.
        read_warning_unverified_measurement_time: Вријеме очитања није поуздано; очитање није приказано као тренутно стање.
        read_warning_partial_sources: Дио извора није доступан или није довољно свјеж.
        read_warning_partial_history: Ово је сачувани пресјек, не потпуна историја мјерења.
        read_warning_check_unavailable: Најновија провјера извора није доступна; провјерите промјењиве детаље код службе.
        read_warning_changed_source: Извор се промијенио и садржај чека нову провјеру.
        read_warning_procedure_incomplete: За документе, накнаде и рокове који нису наведени провјерите службено упутство.
        read_warning_budget_plan: Буџетски износи су планирана издвајања, не извршена потрошња.
        read_warning_effective_date_unknown: Датум објаве не потврђује када одлука важи нити да није замијењена.
        read_warning_eligibility: Услове учешћа провјерите у званичном позиву прије пријаве.
        read_warning_unknown_deadlines: Позиви без поуздано утврђеног рока нису укључени у ове резултате.
        read_warning_area_unresolved: Нисам препознала мјесто из питања. Реци ми комшилук или мјесну заједницу па ћу погледати
          поново.
        read_warning_citywide_scope: Питање сам разумјела као питање за цијели град, па одговор не значи да се односи на сваки
          комшилук.
        read_warning_street_not_published: Знам улицу из питања, али извор не објављује обухват по улицама, па је ово преглед
          за цијели град.
        read_warning_window_not_matched: Извор сам прочитала, али ниједно прикупљено обавјештење не покрива подручје и период
          о којем питаш.
        read_warning_announcement_window: Ово су најављени и текући радови у наредним данима, а не потврда тренутног стања
          на терену.
        read_warning_reviewed_empty: У прегледаној објави извора нема ниједног обавјештења за тражено подручје и период.
        read_warning_content_unreviewed: Садржај извора још није независно прегледан.
        read_warning_extraction_incomplete: Дио садржаја извора нисам успјела прочитати до краја, па преглед није потпун.
        read_warning_extraction_failed: Садржај извора није био у очекиваном облику, па из њега нисам могла издвојити обавјештења.
        read_warning_publication_stale: Посљедња објава извора је старија од рока свјежине, па је могуће да постоји новија.
        read_warning_source_down: Извор ми у овом тренутку није био доступан.
        read_warning_absence_not_normal_service: Ово није потврда да прекида нема — неподударан извор не доказује да је услуга
          уредна.
        cleared: Разговор је обрисан. Шта желиш да урадимо даље?
        credentials: Ради твоје сигурности, немој слати кодове, лозинке или податке за пријаву у разговор. Унеси их само у
          одговарајуће поље на званичној страници за пријаву или потврду налога.
        cancel_confirm: Да поништим ово што смо започели? Напиши „одустани“ ако желиш да прекинемо, или ми реци шта даље.
        cancelled: У реду, одустали смо од овог задатка. Шта желиш даље?
        cancelled_then_next: У реду, одустали смо од претходног задатка.
