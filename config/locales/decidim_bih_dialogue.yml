        civic_vote_integrity: "Ne. Bodovi zajedništva su priznanje, ne moć: ne utječu na glasanje, na rang prijedloga ni na vidljivost sadržaja. Glasanje je jedan građanin — jedan glas, bez obzira na bodove, donacije ili poredak u trci komšiluka. Trka broji registracije, prijave i prijedloge samo radi nagrade komšiluku i ne mijenja nijedan glas. Sva pravila: %{url}"
        civic_privacy: "Što se radi s tvojim podacima ne izmišljam — piše u objavljenoj politici privatnosti: %{url}. Tamo stoji tko je voditelj obrade (%{name}), koji se podaci obrađuju i po kojoj osnovi, koliko se čuvaju, kome se prosljeđuju i koja su tvoja prava. Ono što sam objaviš — prijedlog, komentar, glas, prijava — javno je na platformi. Za pristup, ispravak ili brisanje svojih podataka piši na %{email}."
        civic_newcomer: "MI PRE(D)UZIMAMO! je građanska platforma koju vodi %{name}. Četiri stvari radiš ovdje: prijaviš komunalni problem i vidiš kome je otišao; daš prijedlog i glasaš o tome što se radi; pratiš svoj komšiluk i mjesnu zajednicu; i pitaš me za gradske usluge i servisne informacije. Za doprinos dobivaš bodove zajedništva — priznanje, ne moć. Odakle krećemo?"
        civic_newcomer_chip_report: "Prijavi problem"
        civic_newcomer_chip_komsiluk: "Moj komšiluk"
        civic_newcomer_chip_points: "Bodovi zajedništva"
        launch_invitation_confirmation: "Potvrda dolaska je molba, ne uvjet za ulaz. Ako ne potvrdiš, pozivnica ne propada i na ulazu te propuštamo — samo pokaži broj rezervacije. Poveznica za potvrdu jednim dodirom radi 72 sata od poruke; poslije toga potvrdu ne možeš poslati, ali pozivnica i dalje vrijedi."
        launch_invitation_deadline: "Pravo na pozivnicu stječeš kad skupiš 20 bodova zajedništva, najkasnije 16.9.2026. u 23:59. Trka komšiluka traje do 14.10.2026. — to je drugi rok i s pozivnicom nema veze."
        launch_invitation_eligibility: "Pozivnica se ne dijeli na vratima i ne dobiva se ranijim dolaskom. Treba ti račun na platformi s potvrđenim brojem telefona i odabranim komšilukom — to je 20 bodova i pozivnica stiže porukom. Sama adresa e-pošte, bez potvrđenog broja telefona, nije dovoljna."
        launch_invitation_not_spent: "Bodovi se ne oduzimaju kad dobiješ pozivnicu — 20 bodova je prag, ne cijena. Ostaju ti na računu i kasnije ih možeš potrošiti na nagrade iz kataloga."
        race_overview: "Trka komšiluka traje od 6.9. do 14.10.2026. u 20:00. Boduje se: registrirani × 1 + prijave × 2 + prijedlozi × 3, i to komšiluku autora, ne komšiluku u kojem je problem. Od jedne osobe računa se najviše 5 prijava i 3 prijedloga. Poredak: %{url}"
        race_prize: "Dva komšiluka dobivaju po 3.000 KM — jedan gradski i jedan seoski. Što se gradi bira sam komšiluk, glasanjem na platformi krajem listopada."
        foundation_contact: "%{name} — %{address}. E-pošta: %{email}. Web stranica: %{url}"
        foundation_contact_minimal: "%{name} — kontakt e-pošta: %{email}"
        foundation_phone_unknown: "Javni broj telefona nije objavljen, pa ga ne bih pogađala."
        foundation_phone_not_city: "Broj gradske centrale koji se nađe na internetu pripada Gradskoj upravi — to je druga organizacija."
        # --- R5/R6: who runs and funds the platform, what Milica can do, where a proposal goes
        civic_platform_operator: "Ovu platformu vodi %{name}. Korištenje je besplatno: ni registracija, ni prijava problema, ni prijedlog ni glasovanje se ne naplaćuju. Bodovi zajedništva nemaju novčanu vrijednost."
        civic_funding: "Korištenje platforme ne plaćaš ti — besplatna je. %{statement}"
        civic_identity: "Ovaj razgovor te ne prepoznaje sam od sebe. Ako nisi prijavljen ili prijavljena, o tebi ne znam ništa — ni ime, ni broj telefona, ni komšiluk. Kad se prijaviš, pokazujem ti samo ono što pripada tvom računu i samo kad to zatražiš. Prijava: %{url}"
        civic_chat_messaging: "Ne. Iz ovog razgovora ne šaljem SMS, Viber ni e-poštu i nisam ti ništa poslala. Poruku s poveznicom i kodom šalje sam postupak potvrde broja — novo slanje tražiš na stranici koja čeka potvrdu. Kod nikad ne upisuj u razgovor."
        civic_phone_change: "Broj telefona ti odavde ne mogu promijeniti — u razgovoru ne mijenjam ništa na računu. Dok broj još nije potvrđen, mijenjaš ga na stranici koja čeka potvrdu, i to samo u pregledniku u kojem si se registrirao ili registrirala. Ako je broj već potvrđen, piši na %{email}."
        civic_proposal_route: "Prijedlog ne predaješ meni u razgovoru nego na platformi, i za to ti ne treba organizacija — dovoljan je tvoj račun. Prijedloge građana otvaraš ovdje: %{url}"
        goodwill_referral: 'Poziv preko tvog linka nosi %{points} uz potvrđen telefon i izabran komšiluk. Najranije poslije %{hours}
          sata; najviše %{cap} isplaćenih poziva mjesečno. Višak kvalifikovanih poziva prelazi u naredni mjesec redom. Pravila: %{url}'
        goodwill_referral_pending: Tuđe privatne podatke ne mogu pogledati. Poziv može čekati potvrdu telefona, izbor komšiluka, odgodu
          od %{hours} sata ili naredni mjesec zbog limita. Samo istek odgode ne znači da su svi uslovi ispunjeni.
        goodwill_daily_cap: "Dnevna granica vrijedi samo za bodove, nikada za samu radnju: prijava se pošalje, komentar se objavi, glas se izbroji — tog dana samo više ne nose bodove. Dnevne granice: %{caps}. Sva pravila: %{url}"
        race_standings_intro: "Trka komšiluka — trenutni poredak:"
        race_standings_zone_grad: "Gradski komšiluci"
        race_standings_zone_selo: "Seoski komšiluci"
        race_standings_leader: "%{zone}: vodi %{name}, rezultat %{score}"
        race_standings_no_leader: "%{zone}: još nema rezultata"
        race_standings_observed: "Stanje poretka: %{time}. Cijela tablica: %{url}"
        race_standings_unknown_time: "Vrijeme posljednjeg računanja poretka nije zabilježeno, pa ovo ne prikazujem kao trenutno stanje. Cijela tablica: %{url}"
        race_standings_final: "Poredak je zaključen i više se ne mijenja. Cijela tablica: %{url}"
        race_standings_unavailable: "Trenutni poredak trke sada ne mogu pročitati, pa ne bih navodila brojeve. Tablica je ovdje: %{url}"
        # --- Task 5: the account journeys, one answer per journey
        account_help_chip_register: "Otvaranje računa"
        account_help_chip_sign_in: "Prijava na postojeći račun"
        account_help_chip_verify: "Potvrda broja telefona"
        account_help_chip_terms: "Uvjeti registracije"
        clarify_chip_report: "Želim prijaviti problem"
        clarify_chip_account: "Pomoć s računom"
        clarify_chip_service: "Kada se odvozi smeće?"
        clarify_chip_neighborhood: "Što ima novo u mom komšiluku?"
        account_verification_lifetime: "Poveznica za potvrdu računa i kod iz poruke vrijede 24 sata; poveznica za prijavu bez lozinke vrijedi 10 minuta. Nova poruka poništava prethodnu poveznicu i kod, ali ne resetira broj pogrešnih pokušaja. Nakon pet pogrešnih unosa pričekaj da prođu 24 sata od prvog pogrešnog pokušaja ili koristi važeću poveznicu iz poruke. Nastavi ovdje: %{url}"
        account_code_entry: "Ne treba ti pametni telefon. U poruci stiže i poveznica za jedan dodir i kod koji možeš prepisati. Na stranici za potvrdu i na stranici koja čeka potvrdu uvijek stoji polje „Imam kod iz SMS-a“ — tu unesi kod. U ovaj razgovor kod nemoj slati. Nastavi ovdje: %{url}"
        account_message_missing: "Ako poruka nije stigla: provjeri broj, sačekaj minut i zatraži novo slanje na stranici koja čeka potvrdu. Viber nosi samo poveznicu, a SMS nosi i poveznicu i kod, pa SMS radi i bez Vibera i WhatsAppa. Novo slanje poništava prethodnu poveznicu i kod. Ja odavde ne šaljem poruke ni kodove. Nastavi ovdje: %{url}"
        account_email_requirement: "Adresa e-pošte se traži na obrascu, ali ona ne potvrđuje račun — račun potvrđuje broj telefona. E-pošta služi za povrat pristupa i obavijesti, a dok je ne potvrdiš, lozinku preko nje ne možeš resetovati. Nastavi ovdje: %{url}"
        account_postal_difference: "To su dva različita koraka. Registracija i potvrda broja telefona otvaraju račun i dovoljne su za sve na platformi. Potvrda adrese pismom je poseban korak: pismo stiže na kućnu adresu, a kod iz pisma važi 30 dana. Nije uvjet za račun. Nastavi ovdje: %{url}"
        account_residency: 'Nalog može otvoriti svako; izbor komšiluka sam po sebi nije provjera prebivališta. Registracija čuva telefon
          i izabrani komšiluk. Ako tražiš provjeru adrese pismom, adresa se privremeno obrađuje za taj postupak. Nastavi ovdje: %{url}'
        account_phone_visibility: "Tvoj broj telefona nije javan: ne stoji uz prijavu, uz prijedlog ni na tabli komšiluka i drugi građani ga ne vide. Broj služi za potvrdu računa i za prijavu na račun. Kad prijaviš problem sa svog računa, kontakt ide samo nadležnoj službi da bi mogla da te pita za detalje — ne objavljuje se. Račun: %{url}"
        account_deletion: "Brisanje računa tražiš na stranici svog računa, u dijelu za brisanje računa — ja odavde ništa ne brišem i nisam ništa obrisala. Ono što si već javno objavio ili objavila ne nestaje samim brisanjem računa; ako ti smeta neka objava, reci koja. Račun: %{url}"
        account_settings: "Postavke su na stranici tvog računa: tamo mijenjaš ime, lozinku, jezik, obavijesti i komšiluk. U razgovoru ti ništa nisam promijenila. Račun: %{url}"
        account_sign_out: "Odjava je u meniju računa, gore desno — „Odjavi se“. Na zajedničkom računaru poslije odjave zatvori i prozor preglednika, a sljedeći put otvori privatni prozor. Ja te odavde ne mogu odjaviti. Račun: %{url}"
        account_required_fields: "Na obrascu se traže ime ili nadimak, adresa e-pošte, broj telefona koji potvrđuješ porukom i izbor komšiluka, uz prihvatanje uvjeta. Primanje novosti je dobrovoljno. Sve to upisuješ u obrazac, ne u ovaj razgovor. Nastavi ovdje: %{url}"
        account_registration_award: "Registracija nosi %{points} bodova zajedništva: %{verification} za potvrđen broj telefona i %{area} za izabran komšiluk. Drugog uvjeta nema — ali sam obrazac, bez potvrde broja, još ne nosi ništa. Bodovi su priznanje, a ne moć: ne utiču na glasanje. Nastavi ovdje: %{url}"
        account_already_registered: "Ne moraš ponovo — račun ti je već otvoren i prijavljen ili prijavljena si. Nastavi tamo gdje si stao ili stala. Račun: %{url}"
        # --- Task 5: what a citizen asks ABOUT a report
        report_visibility: 'Evo ko šta vidi. %{public} %{private} Ime prijavioca nije javno prikazano; ovlašteni operateri mogu vidjeti
          povezan nalog. Anonimna prijava ne prosljeđuje kontakt službi. Sve prijave: %{url}'
        report_address_privacy: 'Adresa problema je javna i tačka na mapi stoji tamo gdje je označiš; to može otkriti i kućnu lokaciju.
          Registracija ne traži kućnu adresu, ali provjera pismom je zaseban postupak s privremenom obradom adrese. Označi tačnu lokaciju
          problema bez nepotrebnih privatnih podataka. Obrazac: %{url}'
        report_anonymity: 'Možeš prijaviti anonimno prema službi: kontakt se ne prosljeđuje. Ime prijavioca nije javno ni za jednu
          prijavu. Pouzdano pripisana prijava registrovanom nalogu zadržava iste bodove: obična prijava, duplikat i odbijanje imaju
          svoja pravila i limite. Bez veze s registrovanim nalogom nema ličnih bodova. Obrazac: %{url}'
        report_photo: "Fotografija se prilaže u obrascu za prijavu: polje „Fotografija problema“ prima PNG, JPEG ili WebP do 5 MB i nije obavezno. Fotografija nije javna — vide je samo ovlašteni operateri i služba kojoj prijava ide. Slikaj sam problem, izbliza i iz daljine. Obrazac: %{url}"
        report_duplicate: 'Ako je isti problem već prijavljen, koristi dugme „Isti problem — dodaj potvrdu“ kad ga obrazac ponudi.
          Potvrda povećava javni broj pogođenih građana. Pouzdano povezan registrovani nalog koji ispunjava uslove dobija 5 ličnih
          bodova jednom po istom problemu, unutar zajedničkog dnevnog limita prijava; za trku 0. Veza s nalogom je privatna. Potvrda
          nije pretplata na obavještenja i ne daje službi kontakt. Sačuvaj broj glavne prijave: %{url}'
        report_guidance_only: "Slanje poveznice i uputa ne podnosi prijavu niti potvrđuje da je stigla gradu. Za podnošenje ispuni i pošalji obrazac: %{url}. Ako si ga već poslao, provjeri potvrdu i status svoje prijave."
        report_forwarding: "Ne automatski. Prijava prvo dobije broj i status „Primljeno“ — to znači da je stigla nama, ne gradu. Operater je pregleda i proslijedi nadležnoj službi, i tek tada status postaje „Poslato službi“. Taj status je jedini pouzdan znak da je prosljeđivanje prihvaćeno, a vidiš ga na stranici svoje prijave: %{url}"
        report_resolution_time: "Ne. „Sistem 48“ je obećanje grada da će na prijavu odgovoriti u roku od 48 sati — odgovor, ne popravka. Rok za samo rješavanje ne obećavamo i ja ga ne znam: zavisi od službe i vrste kvara. Ono što možeš pratiti je status prijave, od „Primljeno“ do „Riješeno“: %{url}"
        report_sistem48_overview: "„Sistem 48“ je gradski sistem za prijave komunalnih problema i odgovor nadležne službe. Rok od 48 sati odnosi se na odgovor, ne popravka. Popravka u tom roku nije garantovana. Na platformi možeš pratiti status prijave: %{url}"
        transport_shorten_question: "Pitanje je predugo za ovu pretragu. Napiši polazno stajalište, odredište i dan ili vrijeme putovanja."
        transport_different_destination: "Polazno i dolazno stajalište su ista. Do kojeg drugog stajališta želiš putovati?"
        transport_choose_stop: "Na koje stajalište misliš: %{choices}?"
        transport_no_feasible_journey: "U pregledanim redovima vožnje nisam pronašla odgovarajuću direktnu ili povezanu vožnju za ta stajališta i vrijeme. To ne isključuje druge mogućnosti izvan obuhvata pretrage. Napiši drugo vrijeme ili polazno stajalište da provjerim ponovo."
        transport_no_published_departures: "U pregledanom redu vožnje nema objavljenih polazaka za traženi dan. To nije potvrda da autobus uopšte ne saobraća. Napiši drugi dan da provjerim objavljene polaske."
        transport_search_limits: "Presjedanja: najviše %{maximum_transfers}; vrijeme za presjedanje: najmanje %{minimum_transfer_minutes} min; čekanje: najviše %{maximum_transfer_wait_minutes} min."
        transport_calendar_conflict: "Datum i traženi školski ili praznični režim se ne poklapaju. Želiš li polaske za navedeni datum ili za drugi dan?"
        report_own: "Ne mogu te identificirati samo iz chata. Ako je prijava poslana s računa, prijavi se i otvori svoje prijave. Za anonimnu prijavu sačuvaj potvrdu: privatna poveznica daje privatni status, a referenca na %{url} samo javni status. Bez potvrde ili pristupa računu ne mogu provjeriti privatne detalje."
        report_public_map: "Sve prijave su javne: popis je ovdje %{list}, a karta sa točkama ovdje %{map}. Na karti i u popisu stoje broj prijave, kategorija, adresa, status i datum; opis, fotografija i kontakt nisu javni."
        report_scope: "Prijava ovdje ide gradskoj službi i tiče se javnog prostora i komunalnih problema — rupa, rasvjeta, smeće, voda, ali i buka sa gradilišta ili iz ugostiteljskog objekta, što je sasvim uredna prijava. Spor sa komšijom, imovinski spor ili nešto što je krivično djelo ne rješava komunalna služba: za to su komunalna policija, inspekcija ili policija. Ako je netko u opasnosti, zovi 122. Obrazac: %{url}"
        report_limits: 'Limit ograničava bodove, ne podnošenje: dodatna prijava se zavodi i ide na pregled, bez novih bodova nakon
          limita. Predaja službi je zaseban korak poslije pregleda. Ako tehnička zaštita zaustavi prebrzo slanje, sačekaj pa pokušaj
          ponovo. Obrazac: %{url}'
        own_reports_empty: "Na tvom računu još nema nijedne prijave. Prijave poslane bez računa se ne vezuju za račun, pa za njih čuvaj broj prijave. Novu prijavu otvaraš ovdje: %{url}"
en:
  decidim:
    bih:
      dialogue:
        transport_calendar_date_needed: "Yes, give the exact travel date so I can check the published calendar for that line. A holiday name alone does not confirm departures."
        transport_service_kind_choose_stop: "No departure has been confirmed yet, so I cannot confirm whether it is a school service or a regular service. First choose the boarding stop: %{choices}."
        ask_transport_destination: "Which stop or place are you travelling to?"
        civic_location_help: "GPS is optional. You can give a street, neighbourhood or public landmark; that alone does not identify the service you need. What would you like to use that location for?"
        closure: "Understood."
        civic_vote_without_points: "Yes — points are not a requirement for voting and do not increase vote weight. One person has one vote; other eligibility conditions depend on the specific voting process. Rules: %{url}"
        civic_race_scope: "Understood — we are discussing the neighbourhood race rules."
        report_own_recovery: "You want an existing report. I cannot identify you from chat alone. If you sent the report from your account, sign in and open your reports. For an anonymous report, keep the receipt: its private link gives private status, while a reference at %{url} gives public status only. Without the receipt or account access I cannot check private details."
        trusted_channel_web: "This is the MI web chat; naming another application in a message does not change the channel."
        trusted_channel_unknown: "The channel is determined by the application delivering the message, not by an application name typed in the text. The available technical context does not identify the channel here."
        trusted_account_present: "The platform has authenticated an MI account for this session. A Facebook name or a statement in chat is not proof of identity; this reply has not linked another account or verified a phone number."
        trusted_account_absent: "This session has no authenticated access to your MI account. That does not mean no account exists; check it by signing in on the platform. A Facebook name is not proof of an account, and I have not linked one through this conversation."
        transport_transfer_missed: "If both times are on the same day, no: the first arrives at %{arrival}, while the second leaves at %{departure}, before your arrival. This compares only the supplied times; it does not verify actual departures or an alternative connection."
        transport_transfer_gap: "The supplied times are %{minutes} minutes apart. This does not confirm a connection: actual departures, the distance between stops and a safe pedestrian crossing must be checked."
        transport_crossing_unknown: "Stops across the road do not by themselves establish a connection. I have no verified pedestrian crossing or crossing time. Checking a connection requires exact stops and confirmed departures."
        transport_distance_not_walk: "No. Straight-line distance does not follow streets and crossings as walking does. The walking route can be longer; a map does not confirm that pavements and crossings are accessible."
        transport_absence_not_service: "Correct: lacking a verified timetable is not evidence that buses do not run. Confirm the schedule for that date with the operator."
        transport_location_optional: "GPS is optional. You can give a street, neighbourhood or public landmark and name the stop you want to reach. Without this information I cannot reliably identify a boarding point."
        transport_boarding_unresolved: "I can identify the boarding point only after we establish where you are starting."
        ask_navigation_stop: "I can write directions here; I have not sent a message to another channel. Which exact bus stop do you want to reach? Give its name; GPS is optional."
        ask_navigation_stop_again: "Understood, I will write directions here. I still need the name of the stop you want to reach; you can also give the neighbourhood and a nearby street."
        civic_feedback_description: "Yes. Describe what is wrong and what needs checking. This continues correcting the answer; the text alone does not record a Not helpful rating."
        report_form_link: "The direct form link is %{url} — you can open it in a browser. No report has been sent; opening the link only opens the form."
        read_only_question: "Understood — we are checking information; I am not submitting a report through this conversation."
        transport_verified_only: "I can only confirm departures and connections present in the published timetable. I will not present an unverified connection or night service as an available journey."
        supplied_stop_unresolved: "I cannot reliably find the boarding stop “%{stop}” in the published timetable. Give a registered stop name or the neighbourhood and a nearby street."
        supplied_area_unresolved: "I cannot reliably match “%{area}” to an area in the source. Give the neighbourhood and street name or correct the place name."
        civic_feedback_privacy: "Authorized staff improving Milica can review the rating and limited question and answer text. Clicking permits this private review, with sensitive-text safeguards; it is not published publicly or linked to your account. Your own message can still contain personal information."
        civic_feedback_points: "Clicking Helpful or Not helpful earns no points. It voluntarily rates Milica’s answer, with no reward or account association."
        civic_feedback_change: "In the current web chat both rating buttons are disabled after a successful rating, so another click cannot change it. You can describe a correction in chat; this is not another rating. If sending fails, the buttons allow a retry."
        civic_feedback_typed: "Typing helpful or not helpful in chat does not save a rating. A rating is recorded only by a successful click on an available button. You can describe a mistake in text to continue correcting the answer."
        civic_feedback_deletion: "Not helpful does not delete your previous message. It rates how useful Milica’s answer was; clicking permits private review of limited question and answer text, with sensitive-text safeguards."
        civic_feedback_report: "Helpful and Not helpful rate Milica’s answer. They do not submit a report to the city, change a report’s status or mean a communal problem is resolved. An answer can help while the problem remains."
        civic_feedback_account: "Rating an answer does not open an account or link the rating to one. Ratings use the available button; a chat message alone does not confirm that a click was saved."
        civic_feedback_target: "You rate the usefulness of this particular answer from Milica, not the work of a city service. Helpful means the answer helped; Not helpful means it needs improvement."
        civic_feedback_repair: "Describe the incorrect part of the answer and what needs correcting so we can check it. If the Not helpful button is available, you can send a rating for private review; a written correction is neither a click nor registration."
        report_sistem48_comparison: "MI is the platform where you can prepare a report and follow its status. Sistem 48 is the city system for communal reports and responses from the responsible service; a Milica answer alone does not send a report to the city. Actual forwarding must be confirmed by report status: %{url}"
        report_responsibility: "The responsible city service handles the communal problem, while MI helps you prepare and follow a report; exact responsibility depends on the problem and location. I have sent nothing here and cannot promise a response date: %{url}"
        civic_vote_integrity_brief: "One person has one vote: points and donations do not increase vote weight or proposal ranking or visibility. Rules: %{url}"
        transport_via_required: "I am keeping %{origin} as the origin and %{destination} as the final destination. I cannot confirm a journey via %{via}. Which exact intermediate stop do you want to use?"
        transport_choose_stop_again: "The stop for this journey is still unclear. Choose an exact name: %{choices}."
        ask_stop_again: "I still need the boarding stop to check departures. Give its name or a nearby street; sharing your location is optional."
        ask_area_query_again: "I still cannot identify the area to check. Give the neighbourhood or street name you want checked."
