        registration_newsletter_information: "This choice enables notifications about your reports, the community, the platform and your neighborhood. The platform selects the delivery channel. It starts checked; unchecking it starts all four topics off, while notifications remain available on the platform. You can change topics later in settings. This is optional and separate from the required registration terms. I have not changed your preferences in chat. %{url}"
