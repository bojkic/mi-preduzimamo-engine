        transport_accessibility_unverified: "Nemam provjerene podatke o spuštenim rubnjacima, pristupu bez stepenica ni pristupačnosti vozila. Blizina stajališta ne potvrđuje pristupačnu putanju; prije puta provjeri uvjete s prijevoznikom."
