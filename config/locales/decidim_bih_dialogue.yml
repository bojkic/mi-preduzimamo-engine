        # --- Task 3b: reviewed public-information cards (deterministic, model-free)
        civic_vote_integrity: "No. Community points are recognition, not power: they do not affect voting, a proposal's ranking or the visibility of content. Voting is one resident — one vote, regardless of points, donations or a neighbourhood's position in the race. The race counts registrations, reports and proposals only to award a neighbourhood prize, and it changes no vote. All the rules: %{url}"
        civic_privacy: "I do not invent what happens to your data — it is written in the published privacy policy: %{url}. It names the controller (%{name}), which data are processed and on what basis, how long they are kept, who they are shared with and what your rights are. What you publish yourself — a proposal, a comment, a vote, a report — is public on the platform. To request access, correction or deletion of your data, write to %{email}."
        civic_newcomer: "MI PRE(D)UZIMAMO! is a civic platform run by %{name}. Four things happen here: you report a municipal problem and see where it went; you make a proposal and vote on what gets done; you follow your komšiluk and local community; and you ask me about city services and service notices. Contributing earns community points — recognition, not power. Where do we start?"
        civic_newcomer_chip_report: "Report a problem"
        civic_newcomer_chip_komsiluk: "My komšiluk"
        civic_newcomer_chip_points: "Community points"
        launch_invitation_confirmation: "Confirming attendance is a request, not a condition of entry. If you do not confirm, your invitation does not lapse and we let you in at the door — just show your reservation number. The one-tap confirmation link works for 72 hours from the message; after that you can no longer send a confirmation, but the invitation still stands."
        launch_invitation_deadline: "You qualify for an invitation once you reach 20 community points, by 16.9.2026 at 23:59 at the latest. The neighbourhood race runs until 14.10.2026 — that is a different deadline and has nothing to do with the invitation."
        launch_invitation_eligibility: "Invitations are not handed out at the door and arriving early does not earn one. You need a platform account with a verified phone number and a chosen komšiluk — that is 20 points, and the invitation arrives by message. An e-mail address alone, without a verified phone number, is not enough."
        launch_invitation_not_spent: "Points are not deducted when you receive an invitation — 20 points is a threshold, not a price. They stay in your account and you can spend them on catalogue rewards later."
        race_overview: "The neighbourhood race runs from 6.9. to 14.10.2026 at 20:00. Scoring is: registrations × 1 + reports × 2 + proposals × 3, credited to the author's komšiluk, not to the komšiluk where the problem is. At most 5 reports and 3 proposals per person are counted. Standings: %{url}"
        race_prize: "Two komšiluci each receive 3.000 KM — one urban and one rural. What gets built is chosen by the komšiluk itself, by a vote on the platform at the end of October."
        foundation_contact: "%{name} — %{address}. E-mail: %{email}. Website: %{url}"
        foundation_contact_minimal: "%{name} — contact e-mail: %{email}"
        foundation_phone_unknown: "No public phone number is published, so I will not guess at one."
        foundation_phone_not_city: "The municipal switchboard number you may find online belongs to the City Administration — that is a different organisation."
        # --- R5/R6: who runs and funds the platform, what Milica can do, where a proposal goes
        civic_platform_operator: "This platform is run by %{name}. Using it is free: registration, reporting a problem, making a proposal and voting are never charged for. Community points have no monetary value."
        civic_funding: "You are not the one paying for the platform — it is free to use. %{statement}"
        civic_identity: "This chat does not recognise you on its own. If you are not signed in, I know nothing about you — not your name, your phone number or your komšiluk. Once you sign in, I show you only what belongs to your account, and only when you ask. Sign in: %{url}"
        civic_chat_messaging: "No. I do not send SMS, Viber or e-mail from this chat, and I have sent you nothing. The message carrying the link and the code is sent by the phone confirmation process itself — ask for a new one on the page that is waiting for your confirmation. Never type the code into this chat."
        civic_phone_change: "I cannot change your phone number from here — I change nothing on your account from this chat. While the number is not yet confirmed you change it on the page that is waiting for your confirmation, and only in the browser you registered in. If the number is already confirmed, write to %{email}."
        civic_proposal_route: "You do not hand a proposal to me in this chat, you submit it on the platform, and you do not need to be an organisation — your own account is enough. Citizens' proposals are here: %{url}"
        goodwill_referral: 'Your link earns %{points} after phone verification and neighbourhood selection, no earlier than %{hours}
          hours. Up to %{cap} referrals are paid per month; further eligible referrals carry forward in order. Rules: %{url}'
        goodwill_referral_pending: I cannot view another person’s private data. A referral may be waiting for phone verification,
          neighbourhood selection, the %{hours}-hour delay or a new month because of the limit. Passing the delay alone does not establish
          eligibility.
        goodwill_daily_cap: "The daily limit applies to the points only, never to the action itself: the report is still filed, the comment is still published, the vote is still counted — they simply earn nothing more that day. Daily limits: %{caps}. All the rules: %{url}"
        race_standings_intro: "Neighbourhood race — current standings:"
        race_standings_zone_grad: "Town neighbourhoods"
        race_standings_zone_selo: "Village neighbourhoods"
        race_standings_leader: "%{zone}: %{name} leads with %{score}"
        race_standings_no_leader: "%{zone}: no result yet"
        race_standings_observed: "Standings as of: %{time}. Full table: %{url}"
        race_standings_unknown_time: "The time the standings were last computed is not recorded, so I am not presenting this as the current state. Full table: %{url}"
        race_standings_final: "The standings are final and will not change. Full table: %{url}"
        race_standings_unavailable: "I cannot read the current race standings right now, so I will not quote numbers. The table is here: %{url}"
        # --- Task 5: the account journeys, one answer per journey
        account_help_chip_register: "Create an account"
        account_help_chip_sign_in: "Sign in to an existing account"
        account_help_chip_verify: "Verify my phone number"
        account_help_chip_terms: "Registration terms"
        clarify_chip_report: "I want to report a problem"
        clarify_chip_account: "Help with my account"
        clarify_chip_service: "When is the waste collected?"
        clarify_chip_neighborhood: "What is new in my neighbourhood?"
        account_verification_lifetime: "The account verification link and code are valid for 24 hours; the passwordless sign-in link is valid for 10 minutes. A new message invalidates the previous link and code but does not reset incorrect attempts. After five incorrect entries, wait until 24 hours have passed since the first incorrect attempt or use a valid verification link from the message. Continue here: %{url}"
        account_code_entry: "You do not need a smartphone. The message carries both a one-tap link and a code you can copy out. The verification page and the pending page always show the field labelled \"Imam kod iz SMS-a\" — type the code there. Do not send the code into this chat. Continue here: %{url}"
        account_message_missing: "If the message did not arrive: check the number, wait a minute and ask for a new one on the page that is waiting for your confirmation. Viber carries the link only, while SMS carries both the link and the code, so SMS works without Viber or WhatsApp. A new send invalidates the previous link and code. I do not send messages or codes from here. Continue here: %{url}"
        account_email_requirement: "The form does ask for an e-mail address, but it is not what confirms the account — your phone number is. The e-mail address is for account recovery and notifications, and until you prove it you cannot reset a password through it. Continue here: %{url}"
        account_postal_difference: "These are two different steps. Registration and phone confirmation open the account and are enough for everything on the platform. Confirming an address by post is a separate step: the letter arrives at your home address and the code in it is valid for 30 days. It is not a condition for having an account. Continue here: %{url}"
        account_residency: 'Anyone can register; selecting a neighbourhood alone does not verify residence. Registration retains phone
          and selected neighbourhood. Requesting postal address verification temporarily processes an address for that workflow. Continue:
          %{url}'
        account_phone_visibility: "Your phone number is not public: it is not shown beside a report, a proposal or a komšiluk board post, and other citizens do not see it. The number confirms the account and signs you in. When you report a problem from your account, the contact goes only to the responsible service so they can ask you for details — it is never published. Account: %{url}"
        account_deletion: "You request account deletion on your own account page, in the account deletion section — I delete nothing from here and I have deleted nothing. What you have already published does not disappear just because the account is deleted; if a particular post bothers you, say which one. Account: %{url}"
        account_settings: "The settings are on your account page: name, password, language, notifications and komšiluk are all changed there. I have changed nothing of yours in this chat. Account: %{url}"
        account_sign_out: "Sign-out is in the account menu, top right — \"Odjavi se\". On a shared computer, close the browser window after signing out, and open a private window next time. I cannot sign you out from here. Account: %{url}"
        account_required_fields: "The form asks for a name or nickname, an e-mail address, the phone number you confirm by message, and the komšiluk you choose, plus accepting the terms. Receiving news is optional. All of it goes into the form, not into this chat. Continue here: %{url}"
        account_registration_award: "Registration is worth %{points} goodwill points: %{verification} for a confirmed phone number and %{area} for choosing a komšiluk. There is no other condition — but the form alone, without confirming the number, is not yet worth anything. Points are recognition, never power: they do not affect voting. Continue here: %{url}"
        account_already_registered: "You do not have to do it again — your account is open and you are signed in. Carry on where you left off. Account: %{url}"
        # --- Task 5: what a citizen asks ABOUT a report
        report_visibility: 'Here is who sees what. %{public} %{private} The reporter name is not public; authorized operators can
          see the linked account. Anonymous reporting withholds contact details from the city service. All reports: %{url}'
        report_address_privacy: 'The problem address and exact submitted map point are public, and may reveal a home location. Registration
          does not ask for a home address; postal verification is a separate workflow processing a mailing address temporarily. Mark
          the accurate problem location without unnecessary private data. Form: %{url}'
        report_anonymity: 'You may report anonymously towards the city: contact details are withheld. Reporter names are not public
          on any report. A report reliably attributed to a registered account retains the same earning rules and limits for ordinary,
          duplicate and rejected reports. Unattributed reports earn no personal points. Form: %{url}'
        report_photo: "The photo is attached in the report form: the \"Fotografija problema\" field takes PNG, JPEG or WebP up to 5 MB and is optional. The photo is not public — only authorised operators and the service handling the report see it. Photograph the problem itself, close up and from a distance. Form: %{url}"
        report_duplicate: 'If the same problem is already reported, use “Same problem — add confirmation” when the form offers it.
          This increases the public count of affected citizens. An eligible registered account with trusted attribution earns 5 personal
          points once per problem, within the shared daily report cap, and 0 race points. Account attribution is private. Confirmation
          is not a notification subscription and does not share contact details with the service. Keep the main report reference:
          %{url}'
        report_guidance_only: "Sending a link and instructions does not submit a report or confirm that the city received it. To submit, complete and send the form: %{url}. If you already submitted it, check your report confirmation and status."
        report_forwarding: "Not automatically. A report first gets a number and the status \"Primljeno\" — which means it reached us, not the city. An operator reviews it and forwards it to the responsible service, and only then does the status become \"Poslato službi\". That status is the only reliable sign that forwarding was accepted, and you can see it on your report's page: %{url}"
        report_resolution_time: "No. \"Sistem 48\" is the city's promise to ANSWER a report within 48 hours — an answer, not a repair. We promise no deadline for the repair itself and I do not know one: it depends on the service and the kind of fault. What you can follow is the report's status, from \"Primljeno\" to \"Riješeno\": %{url}"
        report_sistem48_overview: "Sistem 48 is the city system for communal problem reports and a response from the responsible service. The 48 hours concern a response, not a repair; repair within that time is not guaranteed. You can follow report status on the platform: %{url}"
        transport_shorten_question: "The question is too long for this search. Please give the boarding stop, destination and travel day or time."
        transport_different_destination: "The boarding and destination stops are the same. Which other stop do you want to reach?"
        transport_choose_stop: "Which stop do you mean: %{choices}?"
        transport_no_feasible_journey: "I did not find a suitable direct or connecting journey in the reviewed timetables for those stops and time. Other options may exist beyond this search. Give another time or boarding stop so I can check again."
        transport_no_published_departures: "The reviewed timetable has no published departures for that day. This does not confirm that no buses run. Give another day so I can check the published departures."
        transport_search_limits: "Transfers: at most %{maximum_transfers}; transfer buffer: at least %{minimum_transfer_minutes} min; waiting time: at most %{maximum_transfer_wait_minutes} min."
        transport_calendar_conflict: "The date and requested school or holiday schedule do not match. Do you want departures for that date or for another day?"
        report_own: "I cannot identify you from chat alone. If you sent the report from your account, sign in and open your reports. For an anonymous report, keep the receipt: its private link gives private status, while a reference at %{url} gives public status only. Without the receipt or account access I cannot check private details."
        report_public_map: "Every report is public: the list is here %{list} and the map with the points here %{map}. The map and the list carry the report number, the category, the address, the status and the date; the description, the photo and the contact are not public."
        report_scope: "A report here goes to a city service and is about public space and municipal problems — a pothole, street lighting, rubbish, water, and also noise from a building site or a bar, which is a perfectly proper report. A dispute with a neighbour, a property dispute or something that is a criminal offence is not for a municipal service: that is for the communal police, the inspectorate or the police. If anyone is in danger, call 122. Form: %{url}"
        report_limits: 'The limit restricts points, not submission: further reports are recorded for review without more points after
          the limit. Forwarding to the city is a separate step after review. If technical rate protection stops rapid submission,
          wait and retry. Form: %{url}'
        own_reports_empty: "There is not a single report on your account yet. Reports sent without an account are not tied to one, so keep their report number. You open a new report here: %{url}"
