        race_standings_unknown_time: 'Вријеме посљедњег рачунања поретка није забиљежено, па ово не приказујем као тренутно
          стање. Цијела табела: %{url}'
        race_standings_final: 'Поредак је закључен и више се не мијења. Цијела табела: %{url}'
        race_standings_unavailable: 'Тренутни поредак трке сада не могу прочитати, па не бих наводила бројеве. Табела је овдје:
          %{url}'
        account_help_chip_register: Отварање налога
        account_help_chip_sign_in: Пријава на постојећи налог
        account_help_chip_verify: Потврда броја телефона
        account_help_chip_terms: Услови регистрације
        clarify_chip_report: Желим пријавити проблем
        clarify_chip_account: Помоћ с налогом
        clarify_chip_service: Када се одвози смеће?
        clarify_chip_neighborhood: Шта има ново у мом комшилуку?
        account_verification_lifetime: 'Веза за потврду налога и код из поруке важе 24 сата; веза за пријаву без лозинке важи
          10 минута. Нова порука поништава претходну везу и код, али не ресетује број погрешних покушаја. Послије пет погрешних
          уноса сачекај да прођу 24 сата од првог погрешног покушаја или користи важећу везу из поруке. Настави овдје: %{url}'
        account_code_entry: 'Не треба ти паметни телефон. У поруци стиже и веза за један додир и код који можеш преписати.
          На страници за потврду и на страници која чека потврду увијек стоји поље „Имам код из СМС-а“ — ту унеси код. У овај
          разговор код немој слати. Настави овдје: %{url}'
        account_message_missing: 'Ако порука није стигла: провјери број, сачекај минут и затражи ново слање на страници која
          чека потврду. Вибер носи само везу, а СМС носи и везу и код, па СМС ради и без Вибера и WhatsAppa. Ново слање поништава
          претходну везу и код. Ја одавде не шаљем поруке ни кодове. Настави овдје: %{url}'
        account_email_requirement: 'Адреса е-поште се тражи на обрасцу, али она не потврђује налог — налог потврђује број
          телефона. Е-пошта служи за поврат приступа и обавјештења, а док је не потврдиш, лозинку преко ње не можеш ресетовати.
          Настави овдје: %{url}'
        account_postal_difference: 'То су два различита корака. Регистрација и потврда броја телефона отварају налог и довољне
          су за све на платформи. Потврда адресе писмом је посебан корак: писмо стиже на кућну адресу, а код из писма важи
          30 дана. Није услов за налог. Настави овдје: %{url}'
        account_residency: 'Налог може отворити свако; избор комшилука сам по себи није провјера пребивалишта. Регистрација
          чува телефон и изабрани комшилук. Ако тражиш провјеру адресе писмом, адреса се привремено обрађује за тај поступак.
          Настави овдје: %{url}'
        account_phone_visibility: 'Твој број телефона није јаван: не стоји уз пријаву, уз приједлог ни на табли комшилука
          и други грађани га не виде. Број служи за потврду налога и за пријаву на налог. Кад пријавиш проблем са свог налога,
          контакт иде само надлежној служби да би могла да те пита за детаље — не објављује се. Налог: %{url}'
        account_deletion: 'Брисање налога тражиш на страници свог налога, у дијелу за брисање налога — ја одавде ништа не
          бришем и нисам ништа обрисала. Оно што си већ јавно објавио или објавила не нестаје самим брисањем налога; ако ти
          смета нека објава, реци која. Налог: %{url}'
        account_settings: 'Поставке су на страници твог налога: тамо мијењаш име, лозинку, језик, обавјештења и комшилук.
          У разговору ти ништа нисам промијенила. Налог: %{url}'
        account_sign_out: 'Одјава је у менију налога, горе десно — „Одјави се“. На заједничком рачунару послије одјаве затвори
          и прозор прегледача, а сљедећи пут отвори приватни прозор. Ја те одавде не могу одјавити. Налог: %{url}'
        account_required_fields: 'На обрасцу се траже име или надимак, адреса е-поште, број телефона који потврђујеш поруком
          и избор комшилука, уз прихватање услова. Примање новости је добровољно. Све то уписујеш у образац, не у овај разговор.
          Настави овдје: %{url}'
        account_registration_award: 'Регистрација носи %{points} бодова заједништва: %{verification} за потврђен број телефона
          и %{area} за изабран комшилук. Другог услова нема — али сам образац, без потврде броја, још не носи ништа. Бодови
          су признање, а не моћ: не утичу на гласање. Настави овдје: %{url}'
        account_already_registered: 'Не мораш поново — налог ти је већ отворен и пријављен или пријављена си. Настави тамо
          гдје си стао или стала. Налог: %{url}'
        report_visibility: 'Ево ко шта види. %{public} %{private} Име пријавиоца није јавно приказано; овлаштени оператери
          могу видјети повезан налог. Анонимна пријава не просљеђује контакт служби. Све пријаве: %{url}'
        report_address_privacy: 'Адреса проблема је јавна и тачка на мапи стоји тамо гдје је означиш; то може открити и кућну
          локацију. Регистрација не тражи кућну адресу, али провјера писмом је засебан поступак с привременом обрадом адресе.
          Означи тачну локацију проблема без непотребних приватних података. Образац: %{url}'
        report_anonymity: 'Можеш пријавити анонимно према служби: контакт се не просљеђује. Име пријавиоца није јавно ни за
          једну пријаву. Поуздано приписана пријава регистрованом налогу задржава исте бодове: обична пријава, дупликат и
          одбијање имају своја правила и лимите. Без везе с регистрованим налогом нема личних бодова. Образац: %{url}'
        report_photo: 'Фотографија се прилаже у обрасцу за пријаву: поље „Фотографија проблема“ прима ПНГ, ЈПЕГ или WebP до
          5 МБ и није обавезно. Фотографија није јавна — виде је само овлаштени оператери и служба којој пријава иде. Сликај
          сам проблем, изблиза и из даљине. Образац: %{url}'
        report_duplicate: 'Ако је исти проблем већ пријављен, користи дугме „Исти проблем — додај потврду“ кад га образац
          понуди. Потврда повећава јавни број погођених грађана. Поуздано повезан регистровани налог који испуњава услове
          добија 5 личних бодова једном по истом проблему, унутар заједничког дневног лимита пријава; за трку 0. Веза с налогом
          је приватна. Потврда није претплата на обавјештења и не даје служби контакт. Сачувај број главне пријаве: %{url}'
        report_guidance_only: 'Слање линка и упутства не подноси пријаву нити потврђује да је стигла граду. За подношење попуни
          и пошаљи образац: %{url}. Ако си га већ послао, провјери потврду и статус своје пријаве.'
        report_forwarding: 'Не аутоматски. Пријава прво добије број и статус „Примљено“ — то значи да је стигла нама, не граду.
          Оператер је прегледа и прослиједи надлежној служби, и тек тада статус постаје „Послато служби“. Тај статус је једини
          поуздан знак да је просљеђивање прихваћено, а видиш га на страници своје пријаве: %{url}'
        report_resolution_time: 'Не. „Систем 48“ је обећање града да ће на пријаву одговорити у року од 48 сати — одговор,
          не поправка. Рок за само рјешавање не обећавамо и ја га не знам: зависи од службе и врсте квара. Оно што можеш пратити
          је статус пријаве, од „Примљено“ до „Ријешено“: %{url}'
        report_sistem48_overview: '„Систем 48“ је градски систем за пријаве комуналних проблема и одговор надлежне службе.
          Рок од 48 сати односи се на одговор, не поправка. Поправка у том року није гарантована. На платформи можеш пратити
          статус пријаве: %{url}'
        transport_shorten_question: Питање је предуго за ову претрагу. Напиши полазно стајалиште, одредиште и дан или вријеме
          путовања.
        transport_different_destination: Полазно и долазно стајалиште су иста. До којег другог стајалишта желиш путовати?
        transport_choose_stop: 'На које стајалиште мислиш: %{choices}?'
        transport_no_feasible_journey: У прегледаним редовима вожње нисам пронашла одговарајућу директну или повезану вожњу
          за та стајалишта и вријеме. То не искључује друге могућности изван обухвата претраге. Напиши друго вријеме или полазно
          стајалиште да провјерим поново.
        transport_no_published_departures: У прегледаном реду вожње нема објављених полазака за тражени дан. То није потврда
          да аутобус уопште не саобраћа. Напиши други дан да провјерим објављене поласке.
        transport_search_limits: 'Пресједања: највише %{maximum_transfers}; вријеме за пресједање: најмање %{minimum_transfer_minutes}
          мин; чекање: највише %{maximum_transfer_wait_minutes} мин.'
        transport_calendar_conflict: Датум и тражени школски или празнични режим се не поклапају. Желиш ли поласке за наведени
          датум или за други дан?
        report_own: 'Не могу те идентификовати само из цхата. Ако је пријава послана са налога, пријави се и отвори своје
          пријаве. За анонимну пријаву сачувај потврду: приватни линк даје приватни статус, а референца на %{url} само јавни
          статус. Без потврде или приступа налогу не могу провјерити приватне детаље.'
        report_public_map: 'Све пријаве су јавне: списак је овдје %{list}, а карта са тачкама овдје %{map}. На карти и у списку
          стоје број пријаве, категорија, адреса, статус и датум; опис, фотографија и контакт нису јавни.'
        report_scope: 'Пријава овдје иде градској служби и тиче се јавног простора и комуналних проблема — рупа, расвјета,
          смеће, вода, али и бука са градилишта или из угоститељског објекта, што је сасвим уредна пријава. Спор са комшијом,
          имовински спор или нешто што је кривично дјело не рјешава комунална служба: за то су комунална полиција, инспекција
          или полиција. Ако је неко у опасности, зови 122. Образац: %{url}'
        report_limits: 'Лимит ограничава бодове, не подношење: додатна пријава се заводи и иде на преглед, без нових бодова
          након лимита. Предаја служби је засебан корак послије прегледа. Ако техничка заштита заустави пребрзо слање, сачекај
          па покушај поново. Образац: %{url}'
        own_reports_empty: 'На твом налогу још нема ниједне пријаве. Пријаве послане без налога се не везују за налог, па
          за њих чувај број пријаве. Нову пријаву отвараш овдје: %{url}'
bs:
  decidim:
    bih:
      dialogue:
        transport_calendar_date_needed: "Da, napiši tačan datum putovanja. Tada mogu provjeriti objavljeni kalendar za tu liniju; sam naziv praznika nije potvrda polazaka."
        transport_service_kind_choose_stop: "Još nemam potvrđen polazak pa ne mogu potvrditi da li je školski ili redovni. Prvo izaberi polazno stajalište: %{choices}."
        ask_transport_destination: "Do kojeg stajališta ili mjesta putuješ?"
        civic_location_help: "GPS nije obavezan. Možeš napisati ulicu, naselje ili javni orijentir; to samo po sebi ne određuje koju uslugu tražiš. Za šta želiš koristiti tu lokaciju?"
        closure: "U redu."
        civic_vote_without_points: "Da — bodovi nisu uslov za glasanje i ne povećavaju težinu glasa. Jedna osoba ima jedan glas; ostali uslovi učešća zavise od konkretnog procesa glasanja. Pravila: %{url}"
        civic_race_scope: "Razumijem — ostajemo na pravilima trke komšiluka."
        report_own_recovery: "Razumijem, tražiš postojeću prijavu, ne novu. Ne mogu te identifikovati samo iz chata. Ako je prijava poslana sa naloga, prijavi se i otvori svoje prijave. Za anonimnu prijavu sačuvaj potvrdu: privatni link daje privatni status, a referenca na %{url} samo javni status. Bez potvrde ili pristupa nalogu ne mogu provjeriti privatne detalje."
        trusted_channel_web: "Ovo je web razgovor na platformi MI; naziv druge aplikacije u poruci ne mijenja kanal."
        trusted_channel_unknown: "Kanal određuje aplikacija koja je dostavila poruku, ne naziv aplikacije napisan u tekstu. Iz dostupnog tehničkog konteksta ovdje ne mogu potvrditi naziv kanala."
        trusted_account_present: "Za ovu sesiju platforma je potvrdila pristup MI nalogu. Ime na Facebooku ili tvrdnja u poruci nisu dokaz identiteta; ovim odgovorom nisam povezala nijedan dodatni nalog niti potvrdila broj telefona."
        trusted_account_absent: "U ovoj sesiji nemam potvrđen pristup tvom MI nalogu. To ne znači da nalog ne postoji; provjeri ga kroz prijavu na platformu. Ime na Facebooku nije dokaz naloga i ovim razgovorom ga nisam povezala."
        transport_transfer_missed: "Ako su oba vremena istog dana, ne: prvi dolazi u %{arrival}, a drugi odlazi u %{departure}, prije tvog dolaska. Ovo poredi samo navedena vremena; ne potvrđuje stvarne polaske niti rezervnu vezu."
        transport_transfer_gap: "Između navedenih vremena je %{minutes} minuta. To nije potvrda da možeš presjesti: treba provjeriti stvarne polaske, udaljenost stajališta i bezbjedan pješački prelaz."
        transport_crossing_unknown: "Stajališta preko puta ulice sama po sebi ne potvrđuju presjedanje. Nemam provjeren pješački prelaz ni vrijeme potrebno za prelazak. Za provjeru veze trebaju tačna stajališta i potvrđeni polasci."
        transport_distance_not_walk: "Ne. Vazdušna udaljenost je prava linija, a hodanje prati ulice i prelaze. Pješački put može biti duži; mapa nije potvrda da su trotoari i prelazi pristupačni."
        transport_absence_not_service: "Tačno: nedostatak provjerenog reda vožnje nije dokaz da autobusi ne voze. Za taj datum treba potvrditi raspored kod prevoznika."
        transport_location_optional: "GPS nije obavezan. Možeš napisati ulicu, naselje ili javni orijentir i navesti do kojeg stajališta želiš doći. Bez tih podataka ne mogu pouzdano odrediti mjesto za ulazak."
        transport_boarding_unresolved: "Tačno mjesto ulaska mogu odrediti tek kada razjasnimo odakle krećeš."
        ask_navigation_stop: "Uputstvo mogu napisati ovdje; nisam poslala poruku na drugi kanal. Do kojeg tačno autobusnog stajališta želiš doći? Napiši njegov naziv; GPS nije obavezan."
        ask_navigation_stop_again: "Razumijem, uputstvo pišem ovdje. Još mi treba naziv stajališta do kojeg želiš doći; možeš napisati i naselje i obližnju ulicu."
        civic_feedback_description: "Da. Napiši šta je pogrešno i šta treba provjeriti. Time nastavljamo ispravku odgovora; tekst sam ne bilježi ocjenu „Nije korisno“."
        report_form_link: "Direktan link do obrasca je %{url} — možeš ga otvoriti u pregledniku. Prijava još nije poslata; otvaranje linka samo otvara obrazac."
        read_only_question: "Razumijem — provjeravamo informacije; ovim razgovorom ne podnosim prijavu."
        transport_verified_only: "Mogu potvrditi samo polaske i veze koje postoje u objavljenom redu vožnje. Nepotvrđenu vezu ili noćnu liniju neću predstavljati kao dostupan put."
        supplied_stop_unresolved: "Ne mogu pouzdano pronaći polazno stajalište „%{stop}“ u objavljenom redu vožnje. Napiši naziv registrovanog stajališta ili naselje i obližnju ulicu."
        supplied_area_unresolved: "Ne mogu pouzdano povezati „%{area}“ s područjem iz izvora. Napiši naziv naselja i ulicu ili ispravi naziv mjesta."
        civic_feedback_privacy: "Ocjenu i ograničen tekst pitanja i odgovora mogu pregledati ovlašćene osobe koje unapređuju Milicu. Klik dopušta taj privatni pregled, uz zaštitu osjetljivog teksta; sadržaj se ne objavljuje javno i ocjena se ne povezuje s tvojim nalogom. U poruci ipak mogu biti lični podaci koje sam napišeš."
        civic_feedback_points: "Klik na „Korisno“ ili „Nije korisno“ ne donosi bodove. To je dobrovoljna ocjena odgovora Milice, bez nagrade i bez povezivanja s nalogom."
        civic_feedback_change: "U sadašnjem web razgovoru poslije uspješno poslate ocjene oba dugmeta su onemogućena, pa tu ocjenu ne možeš promijeniti drugim klikom. Možeš napisati šta treba ispraviti; ta poruka nije nova ocjena. Ako slanje nije uspjelo, dugmad ponovo dopuštaju pokušaj."
        civic_feedback_typed: "Poruka „korisno“ ili „nije korisno“ u chatu sama ne čuva ocjenu. Ocjena se bilježi tek uspješnim klikom na dostupno dugme. Tekstom možeš objasniti grešku i nastaviti ispravku odgovora."
        civic_feedback_deletion: "Ocjena „Nije korisno“ ne briše prethodnu poruku. Ona ocjenjuje koliko je odgovor Milice pomogao; klik dopušta privatni pregled ograničenog pitanja i odgovora, uz zaštitu osjetljivog teksta."
        civic_feedback_report: "„Korisno“ i „Nije korisno“ ocjenjuju odgovor Milice. Ne podnose prijavu gradu, ne mijenjaju status prijave i ne znače da je komunalni problem riješen. Odgovor može pomoći i dok problem još postoji."
        civic_feedback_account: "Ocjenjivanje odgovora ne otvara nalog i ne povezuje ocjenu s nalogom. Ocjena se bilježi dostupnim dugmetom; sama poruka u razgovoru nije potvrda da je klik uspješno sačuvan."
        civic_feedback_target: "Ocjenjuješ korisnost konkretnog odgovora Milice, ne rad gradske službe. „Korisno“ znači da je odgovor pomogao, a „Nije korisno“ da ga treba popraviti."
        civic_feedback_repair: "Napiši koji dio odgovora je netačan i koji podatak treba ispraviti, pa možemo nastaviti provjeru. Ako je dostupno dugme „Nije korisno“, možeš njime poslati ocjenu za privatni pregled; sama tekstualna ispravka nije klik niti registracija."
        report_sistem48_comparison: "MI je platforma na kojoj možeš pripremiti prijavu i pratiti njen status. Sistem 48 je gradski sistem kojem nadležna služba odgovara na komunalne prijave; odgovor Milice sam ne šalje prijavu gradu. Stvarno prosljeđivanje mora biti potvrđeno statusom prijave: %{url}"
        report_responsibility: "Komunalni problem rješava nadležna gradska služba, a MI pomaže da pripremiš i pratiš prijavu; tačna nadležnost zavisi od vrste problema i lokacije. Ovdje nisam ništa poslala i ne mogu obećati datum odgovora: %{url}"
        civic_vote_integrity_brief: "Jedna osoba ima jedan glas: bodovi i donacije ne povećavaju težinu glasa, rang ni vidljivost prijedloga. Pravila: %{url}"
