        read_warning_changed_source: "Izvor se promijenio i sadržaj čeka novu provjeru."
        read_warning_procedure_incomplete: "Za dokumente, naknade i rokove koji nisu navedeni provjerite službeno uputstvo."
        read_warning_budget_plan: "Budžetski iznosi su planirana izdvajanja, ne izvršena potrošnja."
        read_warning_effective_date_unknown: "Datum objave ne potvrđuje kada odluka važi niti da nije zamijenjena."
        read_warning_eligibility: "Uslove učešća provjerite u zvaničnom pozivu prije prijave."
        read_warning_unknown_deadlines: "Pozivi bez pouzdano utvrđenog roka nisu uključeni u ove rezultate."
        read_warning_area_unresolved: "Nisam prepoznala mjesto iz pitanja. Reci mi komšiluk ili mjesnu zajednicu pa ću pogledati ponovo."
        read_warning_citywide_scope: "Pitanje sam razumjela kao pitanje za cijeli grad, pa odgovor ne znači da se odnosi na svaki komšiluk."
        read_warning_street_not_published: "Znam ulicu iz pitanja, ali izvor ne objavljuje obuhvat po ulicama, pa je ovo pregled za cijeli grad."
        read_warning_window_not_matched: "Izvor sam pročitala, ali nijedno prikupljeno obavještenje ne pokriva područje i period o kojem pitaš."
        read_warning_announcement_window: "Ovo su najavljeni i tekući radovi u narednim danima, a ne potvrda trenutnog stanja na terenu."
        read_warning_reviewed_empty: "U pregledanoj objavi izvora nema nijednog obavještenja za traženo područje i period."
        read_warning_content_unreviewed: "Sadržaj izvora još nije nezavisno pregledan."
        read_warning_extraction_incomplete: "Dio sadržaja izvora nisam uspjela pročitati do kraja, pa pregled nije potpun."
        read_warning_extraction_failed: "Sadržaj izvora nije bio u očekivanom obliku, pa iz njega nisam mogla izdvojiti obavještenja."
        read_warning_publication_stale: "Posljednja objava izvora je starija od roka svježine, pa je moguće da postoji novija."
        read_warning_source_down: "Izvor mi u ovom trenutku nije bio dostupan."
        read_warning_absence_not_normal_service: "Ovo nije potvrda da prekida nema — nepodudaran izvor ne dokazuje da je usluga uredna."
        cleared: "Razgovor je obrisan. Šta želiš da uradimo dalje?"
        credentials: "Radi tvoje sigurnosti, nemoj slati kodove, lozinke ili podatke za prijavu u razgovor. Unesi ih samo u odgovarajuće polje na zvaničnoj stranici za prijavu ili potvrdu naloga."
        cancel_confirm: "Da poništim ovo što smo započeli? Napiši „odustani“ ako želiš da prekinemo, ili mi reci šta dalje."
        cancelled: "U redu, odustali smo od ovog zadatka. Šta želiš dalje?"
        cancelled_then_next: "U redu, odustali smo od prethodnog zadatka."
        busy: "Trenutno obrađujem druge razgovore. Pokušaj ponovo za nekoliko trenutaka."
        admission_deadline: "Nisam uspjela započeti odgovor na vrijeme. Pokušaj ponovo za nekoliko trenutaka."
        processing_deadline: "Nisam uspjela završiti odgovor na vrijeme. Ako se radilo o slanju ili objavi, provjeri status prije ponavljanja."
        factual_history_summary: "Milica je odgovorila koristeći provjereni izvor. Detalji izvora nisu dio istorije za model."
        context_changed: "Druga poruka je u međuvremenu promijenila razgovor. Ponovi posljednji korak; ništa nisam poslala ni objavila."
        context_unavailable: "Trenutno ne mogu pouzdano nastaviti razgovor. Pokušaj ponovo; ništa nisam poslala ni objavila."
        safety: "Ako si u opasnosti, odmah pozovi policiju: 122. Nasilje u porodici: SOS telefon 1264, besplatno i 24 sata. Hitna pomoć 124, vatrogasci 123. Milica ne šalje hitne službe."
        emergency_fire: "Požar: odmah zovi vatrogasce na 123."
        emergency_gas: "Curenje plina ili opasna hemikalija: odmah zovi vatrogasce na 123."
        emergency_flood: "Voda ulazi tamo gdje ima ljudi: odmah zovi vatrogasce na 123."
        emergency_trapped: "Neko je zarobljen ili ne može izaći: odmah zovi vatrogasce na 123."
        emergency_medical: "Neko je povrijeđen, bez svijesti ili ne reaguje: odmah zovi hitnu pomoć na 124."
        emergency_also_medical: "Ako je neko povrijeđen ili ne reaguje, zovi i hitnu pomoć na 124."
        emergency_also_fire: "Ako gori, curi plin ili se neko ne može izvući, zovi i vatrogasce na 123."
        emergency_service_fire: "Vatrogasci: 123."
        emergency_service_medical: "Hitna pomoć: 124."
        emergency_service_police: "Policija: 122. Nasilje u porodici: SOS telefon 1264, besplatno i 24 sata."
        emergency_disclaimer: "Milica ne šalje hitne službe i ne prati poziv."
        clarify: "Želiš li prijaviti gradski problem, pomoć s nalogom, podatke o gradskoj usluzi ili informacije o komšiluku?"
        repair_clarify: "Izvini, pogrešno sam razumjela. Šta treba da ispravim — vrstu pitanja ili neki podatak?"
        ask_query: "Koju uslugu ili problem imaš na umu?"
        ask_description: "Šta se desilo? Napiši kratak opis problema."
        ask_area_query: "U kojem naselju ili ulici? Možeš navesti mjesto bez dijeljenja trenutne lokacije."
        ask_parking_zone: "Koja boja zone piše na parking znaku — bijela, crvena ili plava? Samo lokacija nije dovoljna da sigurno odaberem SMS broj."
        ask_time_expression: "Za koji dan ili vrijeme pitaš?"
        ask_stop: "Odakle želiš krenuti? Napiši ulicu, stajalište ili mjesto. Možeš i podijeliti trenutnu lokaciju ako tvoja aplikacija to podržava."
        ask_reference: "Koja je oznaka tvoje prijave? Status mogu provjeriti samo za prijave koje pripadaju tvom nalogu."
        clarification_limit: "Još nemam dovoljno jasne podatke. Možeš ponovo navesti mjesto i šta ti treba ili koristiti podršku: %{url}"
        no_match: "Za ovo nemam provjeren podatak. To ne znači da ga nema — samo da ga ja ne vidim."
