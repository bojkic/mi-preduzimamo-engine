        account_help_clarify: "Treba li ti otvaranje računa, prijava, potvrda računa ili objašnjenje uvjeta registracije?"
        registration_terms_information: "Polje za uvjete nalazi se na obrascu za registraciju, uz poveznicu za čitanje uvjeta. Prihvaćanje uvjeta je obavezno; primanje novosti je dobrovoljno. Suglasnost se ne daje u razgovoru. Podržani sljedeći korak: %{url}"
        registration_newsletter_information: "Ovaj izbor uključuje obavještenja o tvojim prijavama, zajednici, platformi i komšiluku. Platforma bira kanal za dostavu. Unaprijed je uključen; ako ga isključiš, sve četiri teme počinju isključene, a obavještenja ostaju dostupna na platformi. Teme kasnije možeš promijeniti u podešavanjima. Izbor je dobrovoljan i odvojen od obaveznih uslova registracije. U razgovoru nisam promijenila tvoje postavke. %{url}"
        registration_phone_information: "Pri registraciji telefonom, broj služi za potvrdu pristupa i kasniju prijavu. Unesi ga u obrazac; kod ili poveznicu iz poruke koristi u postupku potvrde, ne u ovom razgovoru. Ovdje nisam poslala kod niti potvrdila račun. Podržani sljedeći korak: %{url}"
        resume_manual: "Automatski povratak sa sačuvanim nacrtom nije podržan. Nakon obrasca vrati se u razgovor; ako se nalog promijeni, radi privatnosti ponovo navedi prethodno pitanje."
        resume_offer: "Sačuvala sam i prethodno ili dodatno pitanje u ovom razgovoru. Napiši „nastavi” da pređemo na njega."
        greeting: "Bok! Ja sam Komšinica Milica. Ti objasni ljudski, ja ću prevesti na formularski. Od čega krećemo: rupa, autobus, odvoz, proračun ili nalog?"
        thanks: "Nema na čemu. Ako još nešto zapne, tu sam."
        farewell: "Bok! Navrati kad god nešto zapne."
        capabilities: "Ne treba ti naziv odjela ni broj ureda. Reci ljudski što ti treba: prijava problema, status, gradska usluga, odvoz otpada, parking, autobus, proračun, Službeni glasnik, tvoj Komšiluk, ideja, glasanje, volontiranje, bodovi ili projekti. Ja ću pohvatati konce."
        resume_nothing: "Nemam spremljeno pitanje. Što te zanima?"
