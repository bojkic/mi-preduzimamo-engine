        launch_invitation_confirmation: "Potvrda dolaska je molba, ne uslov za ulaz. Ako ne potvrdiš, pozivnica ne propada i na ulazu te propuštamo — samo pokaži broj rezervacije. Link za potvrdu jednim dodirom radi 72 sata od poruke; poslije toga potvrdu ne možeš poslati, ali pozivnica i dalje važi."
        launch_invitation_deadline: "Pravo na pozivnicu stičeš kad skupiš 20 bodova zajedništva, najkasnije 16.9.2026. u 23:59. Trka komšiluka traje do 14.10.2026. — to je drugi rok i sa pozivnicom nema veze."
        launch_invitation_eligibility: "Pozivnica se ne dijeli na vratima i ne dobija se ranijim dolaskom. Treba ti račun na platformi sa potvrđenim brojem telefona i izabranim komšilukom — to je 20 bodova i pozivnica stiže porukom. Sama adresa e-pošte, bez potvrđenog broja telefona, nije dovoljna."
        launch_invitation_not_spent: "Bodovi se ne oduzimaju kad dobiješ pozivnicu — 20 bodova je prag, ne cijena. Ostaju ti na računu i kasnije ih možeš potrošiti na nagrade iz kataloga."
        race_overview: "Trka komšiluka traje od 6.9. do 14.10.2026. u 20:00. Boduje se: registrovani × 1 + prijave × 2 + prijedlozi × 3, i to komšiluku autora, ne komšiluku u kojem je problem. Od jedne osobe računa se najviše 5 prijava i 3 prijedloga. Poredak: %{url}"
        race_prize: "Dva komšiluka dobijaju po 3.000 KM — jedan gradski i jedan seoski. Šta se gradi bira sam komšiluk, glasanjem na platformi krajem oktobra."
        foundation_contact: "%{name} — %{address}. Mejl: %{email}. Sajt: %{url}"
        foundation_contact_minimal: "%{name} — kontakt mejl: %{email}"
        foundation_phone_unknown: "Javni broj telefona nije objavljen, pa ga ne bih pogađala."
        foundation_phone_not_city: "Broj gradske centrale koji se nađe na internetu pripada Gradskoj upravi — to je druga organizacija."
        # --- R5/R6: who runs and funds the platform, what Milica can do, where a proposal goes
        civic_platform_operator: "Ovu platformu vodi %{name}. Korištenje je besplatno: ni registracija, ni prijava problema, ni prijedlog ni glasanje se ne naplaćuju. Bodovi zajedništva nemaju novčanu vrijednost."
        civic_funding: "Korištenje platforme ne plaćaš ti — besplatna je. %{statement}"
        civic_identity: "Ovaj razgovor te ne prepoznaje sam od sebe. Ako nisi prijavljen ili prijavljena, o tebi ne znam ništa — ni ime, ni broj telefona, ni komšiluk. Kad se prijaviš, pokazujem ti samo ono što pripada tvom nalogu i samo kad to zatražiš. Prijava: %{url}"
        civic_chat_messaging: "Ne. Iz ovog razgovora ne šaljem SMS, Viber ni e-poštu i nisam ti ništa poslala. Poruku s vezom i kodom šalje sam postupak potvrde broja — novo slanje tražiš na stranici koja čeka potvrdu. Kod nikad ne upisuj u razgovor."
        civic_phone_change: "Broj telefona ti odavde ne mogu promijeniti — u razgovoru ne mijenjam ništa na nalogu. Dok broj još nije potvrđen, mijenjaš ga na stranici koja čeka potvrdu, i to samo u pregledniku u kojem si se registrovao ili registrovala. Ako je broj već potvrđen, piši na %{email}."
        civic_proposal_route: "Prijedlog ne predaješ meni u razgovoru nego na platformi, i za to ti ne treba organizacija — dovoljan je tvoj nalog. Prijedloge građana otvaraš ovdje: %{url}"
        goodwill_referral: 'Poziv preko tvog linka nosi %{points} uz potvrđen telefon i izabran komšiluk. Najranije poslije %{hours}
          sata; najviše %{cap} isplaćenih poziva mjesečno. Višak kvalifikovanih poziva prelazi u naredni mjesec redom. Pravila: %{url}'
        goodwill_referral_pending: Tuđe privatne podatke ne mogu pogledati. Poziv može čekati potvrdu telefona, izbor komšiluka, odgodu
          od %{hours} sata ili naredni mjesec zbog limita. Samo istek odgode ne znači da su svi uslovi ispunjeni.
        goodwill_daily_cap: "Dnevna granica važi samo za bodove, nikada za samu radnju: prijava se pošalje, komentar se objavi, glas se izbroji — tog dana samo više ne nose bodove. Dnevne granice: %{caps}. Sva pravila: %{url}"
        race_standings_intro: "Trka komšiluka — trenutni poredak:"
        race_standings_zone_grad: "Gradski komšiluci"
        race_standings_zone_selo: "Seoski komšiluci"
        race_standings_leader: "%{zone}: vodi %{name}, rezultat %{score}"
        race_standings_no_leader: "%{zone}: još nema rezultata"
        race_standings_observed: "Stanje poretka: %{time}. Cijela tabela: %{url}"
        race_standings_unknown_time: "Vrijeme posljednjeg računanja poretka nije zabilježeno, pa ovo ne prikazujem kao trenutno stanje. Cijela tabela: %{url}"
        race_standings_final: "Poredak je zaključen i više se ne mijenja. Cijela tabela: %{url}"
        race_standings_unavailable: "Trenutni poredak trke sada ne mogu pročitati, pa ne bih navodila brojeve. Tabela je ovdje: %{url}"
        # --- Task 5: the account journeys, one answer per journey
        account_help_chip_register: "Otvaranje naloga"
        account_help_chip_sign_in: "Prijava na postojeći nalog"
        account_help_chip_verify: "Potvrda broja telefona"
        account_help_chip_terms: "Uslovi registracije"
        clarify_chip_report: "Želim prijaviti problem"
        clarify_chip_account: "Pomoć s nalogom"
        clarify_chip_service: "Kada se odvozi smeće?"
        clarify_chip_neighborhood: "Šta ima novo u mom komšiluku?"
        account_verification_lifetime: "Veza za potvrdu naloga i kod iz poruke važe 24 sata; veza za prijavu bez lozinke važi 10 minuta. Nova poruka poništava prethodnu vezu i kod, ali ne resetuje broj pogrešnih pokušaja. Poslije pet pogrešnih unosa sačekaj da prođu 24 sata od prvog pogrešnog pokušaja ili koristi važeću vezu iz poruke. Nastavi ovdje: %{url}"
        account_code_entry: "Ne treba ti pametni telefon. U poruci stiže i veza za jedan dodir i kod koji možeš prepisati. Na stranici za potvrdu i na stranici koja čeka potvrdu uvijek stoji polje „Imam kod iz SMS-a“ — tu unesi kod. U ovaj razgovor kod nemoj slati. Nastavi ovdje: %{url}"
        account_message_missing: "Ako poruka nije stigla: provjeri broj, sačekaj minut i zatraži novo slanje na stranici koja čeka potvrdu. Viber nosi samo vezu, a SMS nosi i vezu i kod, pa SMS radi i bez Vibera i WhatsAppa. Novo slanje poništava prethodnu vezu i kod. Ja odavde ne šaljem poruke ni kodove. Nastavi ovdje: %{url}"
        account_email_requirement: "Adresa e-pošte se traži na obrascu, ali ona ne potvrđuje nalog — nalog potvrđuje broj telefona. E-pošta služi za povrat pristupa i obavještenja, a dok je ne potvrdiš, lozinku preko nje ne možeš resetovati. Nastavi ovdje: %{url}"
        account_postal_difference: "To su dva različita koraka. Registracija i potvrda broja telefona otvaraju nalog i dovoljne su za sve na platformi. Potvrda adrese pismom je poseban korak: pismo stiže na kućnu adresu, a kod iz pisma važi 30 dana. Nije uslov za nalog. Nastavi ovdje: %{url}"
        account_residency: 'Nalog može otvoriti svako; izbor komšiluka sam po sebi nije provjera prebivališta. Registracija čuva telefon
          i izabrani komšiluk. Ako tražiš provjeru adrese pismom, adresa se privremeno obrađuje za taj postupak. Nastavi ovdje: %{url}'
        account_phone_visibility: "Tvoj broj telefona nije javan: ne stoji uz prijavu, uz prijedlog ni na tabli komšiluka i drugi građani ga ne vide. Broj služi za potvrdu naloga i za prijavu na nalog. Kad prijaviš problem sa svog naloga, kontakt ide samo nadležnoj službi da bi mogla da te pita za detalje — ne objavljuje se. Nalog: %{url}"
        account_deletion: "Brisanje naloga tražiš na stranici svog naloga, u dijelu za brisanje naloga — ja odavde ništa ne brišem i nisam ništa obrisala. Ono što si već javno objavio ili objavila ne nestaje samim brisanjem naloga; ako ti smeta neka objava, reci koja. Nalog: %{url}"
        account_settings: "Postavke su na stranici tvog naloga: tamo mijenjaš ime, lozinku, jezik, obavještenja i komšiluk. U razgovoru ti ništa nisam promijenila. Nalog: %{url}"
        account_sign_out: "Odjava je u meniju naloga, gore desno — „Odjavi se“. Na zajedničkom računaru poslije odjave zatvori i prozor pregledača, a sljedeći put otvori privatni prozor. Ja te odavde ne mogu odjaviti. Nalog: %{url}"
        account_required_fields: "Na obrascu se traže ime ili nadimak, adresa e-pošte, broj telefona koji potvrđuješ porukom i izbor komšiluka, uz prihvatanje uslova. Primanje novosti je dobrovoljno. Sve to upisuješ u obrazac, ne u ovaj razgovor. Nastavi ovdje: %{url}"
        account_registration_award: "Registracija nosi %{points} bodova zajedništva: %{verification} za potvrđen broj telefona i %{area} za izabran komšiluk. Drugog uslova nema — ali sam obrazac, bez potvrde broja, još ne nosi ništa. Bodovi su priznanje, a ne moć: ne utiču na glasanje. Nastavi ovdje: %{url}"
        account_already_registered: "Ne moraš ponovo — nalog ti je već otvoren i prijavljen ili prijavljena si. Nastavi tamo gdje si stao ili stala. Nalog: %{url}"
        # --- Task 5: what a citizen asks ABOUT a report
        report_visibility: 'Evo ko šta vidi. %{public} %{private} Ime prijavioca nije javno prikazano; ovlašteni operateri mogu vidjeti
          povezan nalog. Anonimna prijava ne prosljeđuje kontakt službi. Sve prijave: %{url}'
        report_address_privacy: 'Adresa problema je javna i tačka na mapi stoji tamo gdje je označiš; to može otkriti i kućnu lokaciju.
          Registracija ne traži kućnu adresu, ali provjera pismom je zaseban postupak s privremenom obradom adrese. Označi tačnu lokaciju
          problema bez nepotrebnih privatnih podataka. Obrazac: %{url}'
        report_anonymity: 'Možeš prijaviti anonimno prema službi: kontakt se ne prosljeđuje. Ime prijavioca nije javno ni za jednu
          prijavu. Pouzdano pripisana prijava registrovanom nalogu zadržava iste bodove: obična prijava, duplikat i odbijanje imaju
          svoja pravila i limite. Bez veze s registrovanim nalogom nema ličnih bodova. Obrazac: %{url}'
        report_photo: "Fotografija se prilaže u obrascu za prijavu: polje „Fotografija problema“ prima PNG, JPEG ili WebP do 5 MB i nije obavezno. Fotografija nije javna — vide je samo ovlašteni operateri i služba kojoj prijava ide. Slikaj sam problem, izbliza i iz daljine. Obrazac: %{url}"
        report_duplicate: 'Ako je isti problem već prijavljen, koristi dugme „Isti problem — dodaj potvrdu“ kad ga obrazac ponudi.
          Potvrda povećava javni broj pogođenih građana. Pouzdano povezan registrovani nalog koji ispunjava uslove dobija 5 ličnih
          bodova jednom po istom problemu, unutar zajedničkog dnevnog limita prijava; za trku 0. Veza s nalogom je privatna. Potvrda
          nije pretplata na obavještenja i ne daje službi kontakt. Sačuvaj broj glavne prijave: %{url}'
        report_guidance_only: "Slanje linka i uputstva ne podnosi prijavu niti potvrđuje da je stigla gradu. Za podnošenje popuni i pošalji obrazac: %{url}. Ako si ga već poslao, provjeri potvrdu i status svoje prijave."
        report_forwarding: "Ne automatski. Prijava prvo dobije broj i status „Primljeno“ — to znači da je stigla nama, ne gradu. Operater je pregleda i proslijedi nadležnoj službi, i tek tada status postaje „Poslato službi“. Taj status je jedini pouzdan znak da je prosljeđivanje prihvaćeno, a vidiš ga na stranici svoje prijave: %{url}"
        report_resolution_time: "Ne. „Sistem 48“ je obećanje grada da će na prijavu odgovoriti u roku od 48 sati — odgovor, ne popravka. Rok za samo rješavanje ne obećavamo i ja ga ne znam: zavisi od službe i vrste kvara. Ono što možeš pratiti je status prijave, od „Primljeno“ do „Riješeno“: %{url}"
        report_sistem48_overview: "„Sistem 48“ je gradski sistem za prijave komunalnih problema i odgovor nadležne službe. Rok od 48 sati odnosi se na odgovor, ne popravka. Popravka u tom roku nije garantovana. Na platformi možeš pratiti status prijave: %{url}"
        transport_shorten_question: "Pitanje je predugo za ovu pretragu. Napiši polazno stajalište, odredište i dan ili vrijeme putovanja."
        transport_different_destination: "Polazno i dolazno stajalište su ista. Do kojeg drugog stajališta želiš putovati?"
        transport_choose_stop: "Na koje stajalište misliš: %{choices}?"
        transport_no_feasible_journey: "U pregledanim redovima vožnje nisam pronašla odgovarajuću direktnu ili povezanu vožnju za ta stajališta i vrijeme. To ne isključuje druge mogućnosti izvan obuhvata pretrage. Napiši drugo vrijeme ili polazno stajalište da provjerim ponovo."
        transport_no_published_departures: "U pregledanom redu vožnje nema objavljenih polazaka za traženi dan. To nije potvrda da autobus uopšte ne saobraća. Napiši drugi dan da provjerim objavljene polaske."
        transport_search_limits: "Presjedanja: najviše %{maximum_transfers}; vrijeme za presjedanje: najmanje %{minimum_transfer_minutes} min; čekanje: najviše %{maximum_transfer_wait_minutes} min."
        transport_calendar_conflict: "Datum i traženi školski ili praznični režim se ne poklapaju. Želiš li polaske za navedeni datum ili za drugi dan?"
        report_own: "Ne mogu te identifikovati samo iz chata. Ako je prijava poslana sa naloga, prijavi se i otvori svoje prijave. Za anonimnu prijavu sačuvaj potvrdu: privatni link daje privatni status, a referenca na %{url} samo javni status. Bez potvrde ili pristupa nalogu ne mogu provjeriti privatne detalje."
        report_public_map: "Sve prijave su javne: spisak je ovdje %{list}, a karta sa tačkama ovdje %{map}. Na karti i u spisku stoje broj prijave, kategorija, adresa, status i datum; opis, fotografija i kontakt nisu javni."
        report_scope: "Prijava ovdje ide gradskoj službi i tiče se javnog prostora i komunalnih problema — rupa, rasvjeta, smeće, voda, ali i buka sa gradilišta ili iz ugostiteljskog objekta, što je sasvim uredna prijava. Spor sa komšijom, imovinski spor ili nešto što je krivično djelo ne rješava komunalna služba: za to su komunalna policija, inspekcija ili policija. Ako je neko u opasnosti, zovi 122. Obrazac: %{url}"
        report_limits: 'Limit ograničava bodove, ne podnošenje: dodatna prijava se zavodi i ide na pregled, bez novih bodova nakon
          limita. Predaja službi je zaseban korak poslije pregleda. Ako tehnička zaštita zaustavi prebrzo slanje, sačekaj pa pokušaj
          ponovo. Obrazac: %{url}'
        own_reports_empty: "Na tvom nalogu još nema nijedne prijave. Prijave poslane bez naloga se ne vezuju za nalog, pa za njih čuvaj broj prijave. Novu prijavu otvaraš ovdje: %{url}"
hr:
  decidim:
    bih:
      dialogue:
        transport_calendar_date_needed: "Da, napiši tačan datum putovanja. Tada mogu provjeriti objavljeni kalendar za tu liniju; sam naziv praznika nije potvrda polazaka."
        transport_service_kind_choose_stop: "Još nemam potvrđen polazak pa ne mogu potvrditi da li je školski ili redovni. Prvo izaberi polazno stajalište: %{choices}."
        ask_transport_destination: "Do kojeg stajališta ili mjesta putuješ?"
        civic_location_help: "GPS nije obavezan. Možeš napisati ulicu, naselje ili javni orijentir; to samo po sebi ne određuje koju uslugu tražiš. Za šta želiš koristiti tu lokaciju?"
        closure: "U redu."
        civic_vote_without_points: "Da — bodovi nisu uslov za glasanje i ne povećavaju težinu glasa. Jedna osoba ima jedan glas; ostali uslovi učešća zavise od konkretnog procesa glasanja. Pravila: %{url}"
        civic_race_scope: "Razumijem — ostajemo na pravilima trke komšiluka."
        report_own_recovery: "Razumijem, tražiš postojeću prijavu, ne novu. Ne mogu te identificirati samo iz chata. Ako je prijava poslana s računa, prijavi se i otvori svoje prijave. Za anonimnu prijavu sačuvaj potvrdu: privatna poveznica daje privatni status, a referenca na %{url} samo javni status. Bez potvrde ili pristupa računu ne mogu provjeriti privatne detalje."
        trusted_channel_web: "Ovo je web razgovor na platformi MI; naziv druge aplikacije u poruci ne mijenja kanal."
        trusted_channel_unknown: "Kanal određuje aplikacija koja je dostavila poruku, ne naziv aplikacije napisan u tekstu. Iz dostupnog tehničkog konteksta ovdje ne mogu potvrditi naziv kanala."
        trusted_account_present: "Za ovu sesiju platforma je potvrdila pristup MI nalogu. Ime na Facebooku ili tvrdnja u poruci nisu dokaz identiteta; ovim odgovorom nisam povezala nijedan dodatni nalog niti potvrdila broj telefona."
        trusted_account_absent: "U ovoj sesiji nemam potvrđen pristup tvom MI nalogu. To ne znači da nalog ne postoji; provjeri ga kroz prijavu na platformu. Ime na Facebooku nije dokaz naloga i ovim razgovorom ga nisam povezala."
        transport_transfer_missed: "Ako su oba vremena istog dana, ne: prvi dolazi u %{arrival}, a drugi odlazi u %{departure}, prije tvog dolaska. Ovo poredi samo navedena vremena; ne potvrđuje stvarne polaske niti rezervnu vezu."
        transport_transfer_gap: "Između navedenih vremena je %{minutes} minuta. To nije potvrda da možeš presjesti: treba provjeriti stvarne polaske, udaljenost stajališta i bezbjedan pješački prelaz."
        transport_crossing_unknown: "Stajališta preko puta ulice sama po sebi ne potvrđuju presjedanje. Nemam provjeren pješački prelaz ni vrijeme potrebno za prelazak. Za provjeru veze trebaju tačna stajališta i potvrđeni polasci."
        transport_distance_not_walk: "Ne. Vazdušna udaljenost je prava linija, a hodanje prati ulice i prelaze. Pješački put može biti duži; mapa nije potvrda da su trotoari i prelazi pristupačni."
        transport_absence_not_service: "Tačno: nedostatak provjerenog reda vožnje nije dokaz da autobusi ne voze. Za taj datum treba potvrditi raspored kod prevoznika."
        transport_location_optional: "GPS nije obavezan. Možeš napisati ulicu, naselje ili javni orijentir i navesti do kojeg stajališta želiš doći. Bez tih podataka ne mogu pouzdano odrediti mjesto za ulazak."
        transport_boarding_unresolved: "Tačno mjesto ulaska mogu odrediti tek kada razjasnimo odakle krećeš."
        ask_navigation_stop: "Uputstvo mogu napisati ovdje; nisam poslala poruku na drugi kanal. Do kojeg tačno autobusnog stajališta želiš doći? Napiši njegov naziv; GPS nije obavezan."
        ask_navigation_stop_again: "Razumijem, uputstvo pišem ovdje. Još mi treba naziv stajališta do kojeg želiš doći; možeš napisati i naselje i obližnju ulicu."
        civic_feedback_description: "Da. Napiši šta je pogrešno i šta treba provjeriti. Time nastavljamo ispravku odgovora; tekst sam ne bilježi ocjenu „Nije korisno“."
        report_form_link: "Direktan link do obrasca je %{url} — možeš ga otvoriti u pregledniku. Prijava još nije poslata; otvaranje linka samo otvara obrazac."
        read_only_question: "Razumijem — provjeravamo informacije; ovim razgovorom ne podnosim prijavu."
        transport_verified_only: "Mogu potvrditi samo polaske i veze koje postoje u objavljenom redu vožnje. Nepotvrđenu vezu ili noćnu liniju neću predstavljati kao dostupan put."
        supplied_stop_unresolved: "Ne mogu pouzdano pronaći polazno stajalište „%{stop}“ u objavljenom redu vožnje. Napiši naziv registrovanog stajališta ili naselje i obližnju ulicu."
        supplied_area_unresolved: "Ne mogu pouzdano povezati „%{area}“ s područjem iz izvora. Napiši naziv naselja i ulicu ili ispravi naziv mjesta."
        civic_feedback_privacy: "Ocjenu i ograničen tekst pitanja i odgovora mogu pregledati ovlašćene osobe koje unapređuju Milicu. Klik dopušta taj privatni pregled, uz zaštitu osjetljivog teksta; sadržaj se ne objavljuje javno i ocjena se ne povezuje s tvojim nalogom. U poruci ipak mogu biti lični podaci koje sam napišeš."
        civic_feedback_points: "Klik na „Korisno“ ili „Nije korisno“ ne donosi bodove. To je dobrovoljna ocjena odgovora Milice, bez nagrade i bez povezivanja s nalogom."
        civic_feedback_change: "U sadašnjem web razgovoru poslije uspješno poslate ocjene oba dugmeta su onemogućena, pa tu ocjenu ne možeš promijeniti drugim klikom. Možeš napisati šta treba ispraviti; ta poruka nije nova ocjena. Ako slanje nije uspjelo, dugmad ponovo dopuštaju pokušaj."
        civic_feedback_typed: "Poruka „korisno“ ili „nije korisno“ u chatu sama ne čuva ocjenu. Ocjena se bilježi tek uspješnim klikom na dostupno dugme. Tekstom možeš objasniti grešku i nastaviti ispravku odgovora."
        civic_feedback_deletion: "Ocjena „Nije korisno“ ne briše prethodnu poruku. Ona ocjenjuje koliko je odgovor Milice pomogao; klik dopušta privatni pregled ograničenog pitanja i odgovora, uz zaštitu osjetljivog teksta."
        civic_feedback_report: "„Korisno“ i „Nije korisno“ ocjenjuju odgovor Milice. Ne podnose prijavu gradu, ne mijenjaju status prijave i ne znače da je komunalni problem riješen. Odgovor može pomoći i dok problem još postoji."
        civic_feedback_account: "Ocjenjivanje odgovora ne otvara nalog i ne povezuje ocjenu s nalogom. Ocjena se bilježi dostupnim dugmetom; sama poruka u razgovoru nije potvrda da je klik uspješno sačuvan."
        civic_feedback_target: "Ocjenjuješ korisnost konkretnog odgovora Milice, ne rad gradske službe. „Korisno“ znači da je odgovor pomogao, a „Nije korisno“ da ga treba popraviti."
        civic_feedback_repair: "Napiši koji dio odgovora je netačan i koji podatak treba ispraviti, pa možemo nastaviti provjeru. Ako je dostupno dugme „Nije korisno“, možeš njime poslati ocjenu za privatni pregled; sama tekstualna ispravka nije klik niti registracija."
        report_sistem48_comparison: "MI je platforma na kojoj možeš pripremiti prijavu i pratiti njen status. Sistem 48 je gradski sistem kojem nadležna služba odgovara na komunalne prijave; odgovor Milice sam ne šalje prijavu gradu. Stvarno prosljeđivanje mora biti potvrđeno statusom prijave: %{url}"
        report_responsibility: "Komunalni problem rješava nadležna gradska služba, a MI pomaže da pripremiš i pratiš prijavu; tačna nadležnost zavisi od vrste problema i lokacije. Ovdje nisam ništa poslala i ne mogu obećati datum odgovora: %{url}"
        civic_vote_integrity_brief: "Jedna osoba ima jedan glas: bodovi i donacije ne povećavaju težinu glasa, rang ni vidljivost prijedloga. Pravila: %{url}"
        transport_via_required: "Zadržavam polazište %{origin} i krajnje odredište %{destination}. Ne mogu potvrditi put preko %{via}. Koje tačno međustajalište želiš koristiti?"
        transport_choose_stop_again: "Još nije određeno stajalište za ovaj put. Izaberi jedan tačan naziv: %{choices}."
        ask_stop_again: "Za provjeru polaska još mi treba polazno stajalište. Napiši njegov naziv ili obližnju ulicu; trenutna lokacija nije obavezna."
        ask_area_query_again: "Još ne mogu odrediti područje za provjeru. Napiši naziv naselja ili ulice koju želiš provjeriti."
        transport_location_alternatives: "GPS nije obvezan. Napiši početnu ulicu, raskrižje ili javni orijentir; možeš navesti i naziv stajališta. Nastavljamo traženje autobusne veze bez dijeljenja trenutačne lokacije."
        parking_sign_details: "S parkirnog znaka prepiši oznaku ili boju zone i SMS broj, ako su navedeni. Bez tih podataka ne mogu potvrditi koju zonu treba platiti."
        regular_waste_location: "Za raspored redovitog odvoza napiši ulicu ili naselje. Nastavljamo traženje rasporeda; ne pokrećem prijavu problema."
