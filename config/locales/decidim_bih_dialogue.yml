        civic_vote_integrity: "Ne. Bodovi zajedništva su priznanje, ne moć: ne utiču na glasanje, na rang prijedloga ni na vidljivost sadržaja. Glasanje je jedan građanin — jedan glas, bez obzira na bodove, donacije ili poredak u trci komšiluka. Trka broji registracije, prijave i prijedloge samo radi nagrade komšiluku i ne mijenja ni jedan glas. Sva pravila: %{url}"
        civic_privacy: "Šta se radi s tvojim podacima ne izmišljam — piše u objavljenoj politici privatnosti: %{url}. Tamo stoji ko je rukovalac (%{name}), koji se podaci obrađuju i po kom osnovu, koliko se čuvaju, kome se prosljeđuju i koja su tvoja prava. Ono što sam objaviš — prijedlog, komentar, glas, prijava — javno je na platformi. Za pristup, ispravku ili brisanje svojih podataka piši na %{email}."
        civic_newcomer: "MI PRE(D)UZIMAMO! je građanska platforma koju vodi %{name}. Četiri stvari radiš ovdje: prijaviš komunalni problem i vidiš kome je otišao; daš prijedlog i glasaš o tome šta se radi; pratiš svoj komšiluk i mjesnu zajednicu; i pitaš me za gradske usluge i servisne informacije. Za doprinos dobijaš bodove zajedništva — priznanje, ne moć. Odakle krećemo?"
