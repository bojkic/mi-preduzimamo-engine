        farewell: "Ćao! Navrati kad god nešto zapne."
        capabilities: "Ne treba ti naziv odjeljenja ni broj ureda. Reci ljudski šta ti treba: prijava problema, status, gradska usluga, odvoz otpada, parking, autobus, budžet, Službeni glasnik, tvoj Komšiluk, ideja, glasanje, volontiranje, bodovi ili projekti. Ja ću pohvatati konce."
        resume_nothing: "Nemam sačuvano pitanje. Šta te zanima?"
