        read_warning_operator_correction: "Operator je pregledao i ispravio podatke o vrsti, vremenu ili području. Ove ispravke su odvojene od izvornog teksta obavještenja."
        read_warning_conflicting_facts: "Važeći navodi izvora se ne slažu. Ne mogu potvrditi koji je tačan; provjerite oba citirana obavještenja kod nadležne službe."
        fact_observed_at: "Vrijeme mjerenja ili zapažanja: %{time}"
