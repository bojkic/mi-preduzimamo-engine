          levels_intro: "As your contribution grows, so does your standing in the neighbourhood."
          from_points: "from %{points} points"
          spend_title: "What you spend points on"
          spend_intro: "Exchange points for symbolic community rewards."
          spend_policy: "Points are recognition and wallet balance; they have no cash value, never buy votes, and never affect proposal ranking."
          reward_fulfillment_note: "When you redeem a reward, the foundation team manually confirms stock, size, and pickup timing before delivery."
          spend_empty: "The rewards catalogue is currently empty."
          to_wallet: "My contribution"
          to_leaderboard: "Leaderboard"
          to_volunteer: "Volunteering"
          to_rewards: "Rewards"
          monthly_limit:
            one: at most %{count} rewarded action per month
            other: at most %{count} rewarded actions per month
          period_note: Days and calendar months use Sarajevo time. You can continue participating after a limit, but further actions
            of that type earn no personal points in that period.
          report_rule: A report attributed to your account earns %{ordinary} points; a duplicate or “Same problem” confirmation earns
            %{duplicate}; a rejected report earns 0. The same scale applies on the site and supported channels. Anonymity towards the
            city does not reduce points. Reports without a trusted registered account receive no personal points. Duplicates and confirmations
            share one award per person and main problem and the report daily limit.
          referral_rule: Your link earns %{points} points after your neighbour verifies their phone and selects a neighbourhood, no
            earlier than %{hours} hours later. Up to %{cap} paid referrals per month; further eligible referrals carry forward in order.
            Your neighbour contributes to their own neighbourhood in the race.
          visibility_rule: Public recognition is enabled by default. You can disable it in My account to leave public rankings and highlights.
            This does not affect points, rewards or the neighbourhood race. Administrators and active operators are excluded from individual
            public rankings but may contribute to the race.
          correction_rule: Review may correct points for duplicates, rejections or removed content. Your history records the reason
            and change. A correction that would make the wallet negative first requires staff review; wallets stay nonnegative. Use
            Contact for questions or appeals and include the report reference or history entry.
          measures_title: Which points are counted where?
          measures:
            wallet: 'Wallet: points available for rewards. Spending and gifts change the balance.'
            contribution: 'Contribution: recognized activity used for levels and public rankings. Spending does not reduce it; corrections
              can change it.'
            season: 'Season: contribution since the stated date. Starting a new season does not erase the wallet or all-time contribution.'
            race: 'Neighbourhood race: a separate calculation during the contest. Personal points are neither race points nor voting
              power.'
          comparison_title: Personal points and the race
          comparison_headers:
            action: Action
            personal: Community points
            race: Race points
          comparison:
            registration: Verified phone and selected neighbourhood
            registration_personal: '%{points}, once'
            registration_race: '%{points}, subject to race eligibility'
            report: Eligible report attributed to an account
            report_personal: '%{points}; at most %{cap} rewarded actions per day'
            report_race: '%{points}; at most %{cap} throughout the race'
            duplicate: Duplicate / “Same problem”
            duplicate_personal: '%{points}; once per person and main problem'
            duplicate_race: '0'
            proposal: Published citizen proposal
            proposal_personal: '%{points}; at most %{cap} per month'
            proposal_race: '%{points}; at most %{cap} throughout the race'
            other: Volunteering, referrals, likes and other actions
            other_personal: According to the table and rules below
            other_race: '0'
          comparison_note: 'Race participation also requires a verified phone, an eligible source and the contest window. Rejected reports
            earn no points. A proposal not selected for implementation is different from hidden or deleted prohibited content. Full
            race rules:'
          faq_title: Questions about points and the race
          faq:
            corrections:
              q: Why have my points decreased?
              a: 'Check your wallet history: spending changes the available balance, while a correction may also change contribution.
                Duplicates earn fewer points than new reports; rejected reports earn none. Use Contact to dispute a specific history
                entry.'
            volunteering:
              q: Does signing up or attendance confirmation earn volunteer points?
              a: Neither is enough by itself. Approved work earns base points once per Sarajevo calendar day. Hours are recorded separately;
                any organization bonus depends on its offer and available budget.
            moves:
              q: What if I change neighbourhood?
              a: You can change your neighbourhood for everyday use. This race retains the first neighbourhood established by reliable
                contest evidence. Moving does not transfer earlier points; the referrer does not decide the invited person’s neighbourhood.
            ties:
              q: How are ties resolved?
              a: Total score comes first, followed by rewarded reports and rewarded proposals. An administrator resolves a complete
                tie and records a reason. There is no automatic draw or promised three-day deadline.
            projects:
              q: Who proposes and chooses the winning neighbourhood’s project?
              a: The Foundation opens a separate process with published dates and proposals. Voting eligibility uses verified phone
                and membership of the winning neighbourhood at the race cutoff. Dates are announced when the process is ready; points
                do not grant extra votes.
            closed:
              q: What happens after the race closes?
              a: Closing the earning window does not declare a winner. Staff review the result and publish approved final standings.
                Race scores may later be hidden manually; winner and project information remains.
            privacy:
              q: Do anonymous reports or opting out of recognition change points?
              a: No. An anonymous report withholds contact details from the city. If it is reliably linked to a registered account,
                the same points apply. Opting out of recognition hides individual highlights without changing your wallet or the race.
