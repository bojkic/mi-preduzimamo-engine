      mi_bot:
        show:
          conversations:
            desc: 'Each channel keeps its own look, but the bot stays the same — warm, clear, talking to you like a neighbour. Below are typical flows: reporting a problem, a proposal, a budget vote, and SMS for those without internet.'
            kicker: Conversations by channel
            title: Four channels, one neighbour.
          capabilities:
            desc: The bot reads connected public sources and platform data, so it can answer briefly, name the source and point to the right next step.
            kicker: What the bot knows
            note: When an answer comes from a public source, the bot shows the source and verification time. For official requests it points to the form, responsible service or connected channel.
            source_label: "Sources:"
            title: Local data, services and the platform in one conversation.
            items:
              transport:
                title: Public transport
                body: Timetables, stops, next departures and transfer options when the host connects a transport schedule.
                source: Official timetables or transport data connected by the host.
              parking:
                title: Parking
                body: Zones, streets, prices, operating hours and payment instructions when parking data is available.
                source: Public parking-service notices or a local street-zone table.
              waste:
                title: Waste collection
                body: Collection days by settlement or street, with a short answer for the exact place.
                source: Utility schedules maintained by the host in bot data.
              service_notices:
                title: Service notices
                body: Electricity, water, heating, road, city, civil-protection and police-service notices when those sources are connected.
                source: Official service notices and reviewed host sources.
              environment:
                title: Weather, rivers and air
                body: Weather warnings, Sava and Drina water levels, air quality and other readings that are informational, not medical or safety advice.
                source: Hydrometeorological, city and connected sensor sources.
              city_services:
                title: City services
                body: Documents, gazette items, decisions, contacts, local communities and other practical citizen questions.
                source: Official city pages, public registers and platform data.
              reports:
                title: Reports and status
                body: Guidance for public-service reports, status by case number and updates when a case moves.
                source: The report module, connected processing service and public statuses.
              community:
                title: Citizen participation
                body: Ideas, voting, volunteering, neighbourhood posts, donations, points and useful account reminders.
                source: Platform modules and organization settings.
          cta:
            budget: See the reports map
            report: Report a problem
            try_bot: Try the platform assistant
          hero:
            eyebrow: Platform assistant · a kit for activism in a message
            lead: Talk to the platform assistant on this site and find the right next step for reports, city data, participation, volunteering and donations.
            web_boundary: The site assistant provides guidance and links to the official form; a chat message does not itself create a problem report.
            channel_note: This page shows only the available site conversation. Viber appears separately only when the official channel is connected and ready.
            title_accent: a message away.
            title_lead: Your city is
