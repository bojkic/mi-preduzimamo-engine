          title: "How does it work?"
          subtitle: "Contribute to your city — collect points. Here's how to earn them and what to spend them on."
          no_vote_title: "Points are recognition, not power"
          no_vote_policy: "Goodwill points are only a sign of recognition for your contribution to the community. They have no cash value and cannot be exchanged for money. They never affect voting, proposal ranking, or how visible a proposal is. Your participation vote counts exactly the same as every other neighbour's — regardless of how many points you have."
          earn_title: "How you earn points"
          earn_intro: Each action has its own value and conditions. The table shows current points and limits on rewarded actions.
          volunteer_daily_rule: "Confirmed work earns %{day_points} base points once per person on each Sarajevo calendar day, regardless of hours or opportunity. Proposing an opportunity earns %{proposal_points} points once across all its shifts. Actual hours are recorded; an organization may separately award an hourly bonus under its offer and available budget."
          verification_note: Volunteer work earns points after approval. Phone verification and neighbourhood selection are enough for
            a referral; another post is not required. The waiting period and monthly limit still apply.
          daily_limit:
            one: 'at most %{count} scored action per day'
            other: 'at most %{count} scored actions per day'
