        messages:
          default_email_subject: "MI PRE(D)UZIMAMO!"
          p1:
            viber: |
              %{ime}, your invite is ready.
              See you September 17 at the Culture Center. Doors open at 19:00, program starts at 20:00.
              Your reservation number: %{kod} — show it at the door.
              Confirm your attendance: %{link}
              One more thing: you're close to earning Neighbourhood Activist status. The race runs until October 14 — %{komsiluk} is competing for 3,000 KM.
          p3:
            viber: |
              Your attendance is confirmed. Sep 17, Culture Center. Doors 19:00, start 20:00. Reservation number: %{kod}. Bring your phone.
              The list locks at 19:45, so come early — there's music, coffee and people from your neighbourhood in the lobby.
          p4:
            viber: |
              %{ime}, you're %{fali} points away from an invite for September 17.
              The fastest way is to report one problem on your street — a photo, a location, done in a minute. %{link}
              %{ostalo} invites remain.
          p5:
            viber: |
              %{broj} new invites for September 17 are now open.
              Same rule as before: register, pick your neighbourhood and do one real thing. %{link}
          p7:
            viber: |
              See you tonight! Culture Center, doors 19:00, start 20:00. Reservation number: %{kod}. Come early, the list locks at 19:45.
          p8:
            viber: 'Thank you for taking part in the MI community.

              The verified platform overview records %{broj} reports. A record alone does not establish that every report has been forwarded
              or resolved.

              Your neighbourhood %{komsiluk} is currently %{mjesto} in the race. Two winning neighbourhoods — one urban and one rural
              — each receive 3,000 KM for their chosen project.

              Current overview and rules: %{link}'
          p9:
            viber: |
              Neighbourhood race, %{datum}
              Your neighbourhood %{komsiluk} is %{mjesto}. %{broj} days remain.
              Urban: %{grad_lista}
              Rural: %{selo_lista}
              Full list: %{link}
          p10:
            viber: |
              We have winners.
              Urban: %{grad_lista}
              Rural: %{selo_lista}
              Each one wins 3,000 KM for a project in their own community.
              What exactly gets done is entirely up to them. Voting opens %{datum} on the platform.
              Thank you to everyone who reported, proposed and called their neighbours. Final standings: %{link}
          p11:
            email_subject: "Starting September 17, residents of your local community are reporting issues on the MI platform"
            email: |
              Dear Sir or Madam,

              The platform's operator is launching the MI platform on September 17, where residents report problems on their street, submit proposals and follow up on what happens next.

              Reports from your local community reach you. So we ask two things of you:

              1. Create an account — it takes a minute and a phone number: %{link}
              2. Reply within 72 hours, even with just "received, forwarded". That is all we ask. A resident who sees that someone read their report comes back next time; one who sees nothing does not.

              We also invite you to the launch, September 17 at 19:00 at the Culture Center. Please confirm your attendance at %{link}.

              To avoid any misunderstanding: this platform is organised and funded solely by its own operator, outside any party or election campaign. No party or candidate is an organiser, partner or funder, and no holder of public office speaks from the stage.

              Kind regards,
              The MI platform team
