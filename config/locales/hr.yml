        help: |-
          Pozdrav, susjede! 👋 Ja sam asistent platforme — tvoj digitalni asistent i prečac do grada. Što radimo danas?
          📍 Prijavi problem · 💡 Predloži ideju · 💰 Proračun grada · ❤️ Doniraj

          Mogu ti pomoći i da:
          • pitaš za gradske usluge (npr. „izvod iz matične knjige“, „parking“),
          • saznaš dan odvoza otpada (npr. „odvoz otpada Glavna ulica“),
          • provjeriš trenutačne obavijesti (npr. „ima li isključenja struje u mom Komšiluku“),
          • pogledaš svoje bodove („moji bodovi“) i podesiš račun/verifikaciju,
          • saznaš kako predložiti ideju, glasati ili volontirati,
          • nađeš predsjednika i telefon mjesne zajednice,
          • vidiš što ima u Komšiluku („što ima u Komšiluku?“),
          • nađeš odluke iz Službenog glasnika ili podatke o donacijama,
          • prijaviš komunalni problem (opiši ga ili pošalji fotografiju/lokaciju),
          • provjeriš status prijave (pošalji broj u formatu BR-2026-0001).
