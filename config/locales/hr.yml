      launch:
        messages:
          default_email_subject: "MI PRE(D)UZIMAMO!"
          p1:
            viber: |
              %{ime}, pozivnica je tvoja.
              Vidimo se 17. septembra u Centru za kulturu. Vrata se otvaraju u 19:00, program počinje u 20:00.
              Tvoj broj rezervacije: %{kod} — pokaži ga na ulazu.
              Potvrdi dolazak: %{link}
              Još nešto: fali ti još malo do zvanja Aktivista svog komšiluka. I do 14. oktobra traje trka — %{komsiluk} se takmiči za 3.000 KM.
          p3:
            viber: |
              Dolazak je potvrđen. 17.9, Centar za kulturu. Vrata 19:00, početak 20:00. Broj rezervacije: %{kod}. Ponesi telefon.
              U 19:45 se zaključava lista, pa dođi ranije — u foajeu ima muzike, kafe i ljudi iz tvog komšiluka.
          p4:
            viber: |
              %{ime}, fali ti još %{fali} bodova do pozivnice za 17. septembar.
              Najbrže je da prijaviš jedan problem u svojoj ulici — fotografija, lokacija, gotovo za minut. %{link}
              Ostalo je još %{ostalo} pozivnica.
          p5:
            viber: |
              Novih %{broj} pozivnica za 17. septembar je otvoreno.
              Uslov je isti: registruj se brojem telefona i izaberi svoj komšiluk. %{link}
          p7:
            viber: |
              Vidimo se večeras! Centar za kulturu, vrata 19:00, početak 20:00. Broj rezervacije: %{kod}. Dođi ranije, u 19:45 se zaključava lista.
          p8:
            viber: 'Hvala što učestvuješ u zajednici MI.

              U provjerenom pregledu na platformi zabilježeno je %{broj} prijava. Sam zapis ne potvrđuje da je svaka prijava proslijeđena
              službi ili riješena.

              Tvoj komšiluk %{komsiluk} je u trci trenutno %{mjesto}. Dva pobjednička komšiluka — jedan gradski i jedan seoski — dobijaju
              po 3.000 KM za projekat koji izaberu.

              Aktuelni pregled i pravila: %{link}'
          p9:
            viber: |
              Trka komšiluka, %{datum}
              Tvoj komšiluk %{komsiluk} je %{mjesto}. Ostalo je još %{broj} dana.
              Grad: %{grad_lista}
              Selo: %{selo_lista}
              Cijela lista: %{link}
          p10:
            viber: |
              Imamo pobjednike.
              Grad: %{grad_lista}
              Selo: %{selo_lista}
              Svaki dobija 3.000 KM za projekat u svojoj sredini.
              Šta će se tačno uraditi — biraju sami. Glasanje počinje %{datum} na platformi.
              Hvala svima koji su prijavljivali, predlagali i zvali komšije. Konačan poredak: %{link}
          p11:
            email_subject: "Od 17. septembra građani vaše mjesne zajednice prijavljuju probleme na platformi MI"
            email: |
              Poštovani/poštovana,

              Organizator platforme MI 17. septembra pokreće platformu na kojoj građani prijavljuju probleme u svojoj ulici, daju prijedloge i prate šta se s njima dešava.

              Prijave iz vaše mjesne zajednice stižu vama. Zato vas molimo za dvije stvari:

              1. Otvorite nalog — treba vam minut i broj telefona: %{link}
              2. Odgovorite u roku od 72 sata, makar samo sa „primljeno, proslijeđeno”. To je jedino što tražimo. Građanin koji vidi da je neko pročitao njegovu prijavu vraća se i sljedeći put; onaj koji ne vidi ništa — ne vraća se.

              Pozivamo vas i na lansiranje, 17. septembra u 19:00 u Centru za kulturu. Molimo da potvrdite dolazak na %{link}.

              Da ne bude nesporazuma: ovu platformu organizuje i finansira isključivo njen nosilac, van bilo koje stranačke ili izborne kampanje. Nijedna stranka ni kandidat nije organizator, partner ni finansijer, i sa bine ne govori nijedan nosilac javne funkcije.

              S poštovanjem,
              Tim platforme MI
