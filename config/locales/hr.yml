          no_vote_title: Bodovi su priznanje, ne moć # LFBN-COPY-REVIEW
          no_vote_policy: Bodovi zajedništva su samo znak priznanja za tvoj doprinos zajednici. Nemaju novčanu vrijednost i ne mogu se zamijeniti za novac. Nikada ne utječu na glasanje, na rang prijedloga niti na to koliko je neki prijedlog vidljiv. Tvoj glas u participaciji vrijedi jednako kao i glas svakog drugog susjeda — bez obzira na broj bodova. # LFBN-COPY-REVIEW
          earn_title: "Kako osvajaš bodove"
          earn_intro: Svaka radnja ima svoju vrijednost i uslove. Tabela prikazuje trenutno važeće bodove i granice broja bodovanih
            radnji.
          volunteer_daily_rule: "Potvrđen rad donosi %{day_points} osnovnih bodova jednom po osobi za svaki kalendarski dan u Sarajevu, bez obzira na sate ili priliku. Prijedlog prilike donosi %{proposal_points} bodova jednom za sve njezine termine. Stvarni sati se bilježe; organizacija može zasebno dodijeliti bonus po satu prema ponudi i raspoloživom proračunu."
          verification_note: Volonterski rad boduje se nakon odobrenja rada. Za poziv je dovoljna registracija s potvrđenim telefonom
            i izabranim komšilukom; dodatna objava nije uslov. Rok i mjesečni limit vrijede i za takav poziv.
