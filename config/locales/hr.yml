            other: 'najviše %{count} bodovanih radnji dnevno'
          levels_title: "Razine priznanja"
          levels_intro: "Kako rasteš u doprinosu, rasteš i u zvanju Komšiluka."
          from_points: "od %{points} bodova"
          spend_title: "Na što trošiš bodove"
          spend_intro: "Bodove mijenjaš za simbolične nagrade zajednice."
          spend_policy: "Bodovi su priznanje i stanje novčanika; nemaju novčanu vrijednost, ne kupuju glasove i ne utječu na rang prijedloga."
          reward_fulfillment_note: "Kada preuzmeš nagradu, tim fondacije ručno potvrđuje zalihe, veličinu i termin preuzimanja prije isporuke."
          spend_empty: "Katalog nagrada je trenutno prazan."
