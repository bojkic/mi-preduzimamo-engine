sr-Cyrl:
  decidim:
    bih:
      admin:
        board_review:
          tabs:
            delivery: Испорука
        board_delivery_operations:
          title: Испорука за преглед
          hint: Бројеви означавају потврде за чланове, покушаје по уређају или објаве, како је наведено. Отвори објаву за преглед доказа и, када је дозвољено, припрему новог тачног плана слања на телефоне. Овај преглед не понавља слање.
          thresholds: Чекање се приказује послије 15 минута; започети захтјев на телефон послије 30 минута; прихваћени захтјев након једног сата без провјере извјештаја. Грешке пусх испоруке односе се на важеће објаве. Захтјев са непознатим исходом можда је већ прихваћен код пружаоца услуге.
          empty: За изабране филтере нема испорука са табле које траже преглед.
          review: Прегледај испоруку
          source_hint: Бројеви изворног процеса обухватају сва градска обавјештења којима можеш управљати, независно од филтера табле. Приказано је до 10 одговарајућих изворних обавјештења.
          source_reference: Прегледај градско обавјештење бр. %{id}
          source_review: Отвори градска обавјештења
          issues:
            inbox_stalled: Заостале потврде обавјештења на платформи
            push_stalled: Заостале потврде пусх испоруке
            push_failed: Неуспјели пусх покушаји по уређају
            push_uncertain: Пусх покушаји са неизвјесним исходом
            phone_stalled: Заостали захтјеви за телефоне
            phone_failed: Одбијени или неуспјели захтјеви за телефоне
            phone_unknown: Захтјеви за телефоне са непознатим исходом
            phone_expired: Истекли захтјеви за телефоне који чекају затварање
            expiry_backlog: Истекле објаве које чекају затварање
            source_failed: Градска обавјештења са грешком објављивања
            source_stalled: Градска обавјештења са заосталим објављивањем
            source_expired: Градска обавјештења истекла без објаве
          intro: Отвори објаву за преглед испоруке.
          counts_detail: Бројеви испорука и рокови
