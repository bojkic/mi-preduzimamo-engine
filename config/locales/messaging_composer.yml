# The shared operator composer (Phase 5, Task 5.1).
#
# `sr-Cyrl` is TRANSLITERATED from `sr` with Decidim::Bih::Transliterator —
# never hand-edited. `bs` and `hr` are seeded from `sr`.
---
en:
  decidim:
    bih:
      admin:
        composer:
          title: Before you send
          audience:
            title: Who this reaches
            eligible: Will receive
            suppressed: Chose not to / blocked
            undeliverable: Cannot be reached
            unavailable: The audience could not be counted right now. No number is shown rather than a possibly wrong one.
          reasons:
            preference_blocked: Turned this off
            preference_absent: Never chose this
            transport_suppressed: Durable provider STOP
            provider_opt_out: Opted out at the provider
            optional_unsubscribe: Unsubscribed
            destination_unknown: No address on record
            channel_unconfigured: Channel not configured
            template_required: No approved template
            connection_required: No linked conversation
            session_expired: Linked conversation expired
            account_unavailable: Account blocked or deleted
            dispatch_disabled: Sending is switched off
            rate_limited: Rate limited
            expired: Past its useful lifetime
            unsupported_channel: This message never uses that channel
            decision_unavailable: Could not be decided
          content:
            title: What each channel carries
            variant: 'variant: %{variant}'
            not_previewable: No text to preview for this channel yet.
            unsupported: "%{channel}: this message class carries nothing on that channel."
          readiness:
            title: What is blocking this
            ready: Nothing is blocking this send right now.
            unknown: Readiness could not be established. The same checks run again at send time.
            open_governance: Review the owner decision
          blockers:
            not_authorized: You do not hold the permission this send needs.
            governance_missing: There is no current owner decision for this channel.
            preview_expired: The preview is older than ten minutes. Preview again.
            preview_mismatch: What is on screen is no longer what would be sent. Preview again.
            audience_changed: The audience changed since the preview. Preview again.
            expired: This message is past its useful lifetime.
            channel_not_ready: The provider settings or health for this channel are not ready.
          cost:
            title: What this costs
            unavailable: The cost could not be estimated.
            segments_only: "%{count} billable message(s). The unit price is not on record here, so no amount is shown."
            segments_and_amount: "%{count} billable message(s), about %{amount} %{currency}."
          confirm:
            title: Confirm
            reviewed: I have reviewed the text and the audience above.
          channels:
            bell: Notification bell
            push: Browser push
            email: E-mail
            sms: SMS
            viber: Viber
            whatsapp: WhatsApp
            messenger: Messenger
            instagram: Instagram
            postal: Post
            web_chat: Web chat
        send_consequences:
          title: This action also sends
          intro: Saving this will trigger the messages below. They are not a bulk campaign and need no confirmation step.
          to:
            account: the citizen
            staff: the operator team
            pending_authentication: the number being verified
            anonymous_report_contact: the report's own contact address
            external_institution: the institution
            operator_mailbox: the operator mailbox
            provider_inbound_identity: the chat identity
          via: via %{channels}
          boundary: "%{purpose}: MI does not send this; it is handled outside the platform."
        newsletter:
          audience:
            suppression_applied: Addresses that bounced, complained or asked to stop are already excluded.
            proven_address_only: Only citizens whose current address has been proven are counted.
            all_subscribed: Every subscribed citizen is counted; proven-address narrowing is off.
