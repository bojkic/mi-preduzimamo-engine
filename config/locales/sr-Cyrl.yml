            other_race: '0'
          comparison_note: 'Трка додатно тражи потврђен телефон, прихватљив извор и такмичарски период. Одбијена пријава не доноси бодове.
            Одбијен приједлог који само није изабран за реализацију није исто што и скривен или обрисан недозвољен садржај. Пуна правила
            трке:'
          faq_title: Честа питања о бодовима и трци
          faq:
            corrections:
              q: Зашто се број бодова смањио?
              a: 'Погледај историју новчаника: трошење мијења расположиво стање, а образложена исправка може промијенити и допринос.
                Дупликат вриједи мање од нове пријаве; одбијена пријава не вриједи бодове. Приговор пошаљи кроз Контакт уз конкретан
                запис.'
            volunteering:
              q: Да ли пријава за волонтирање или потврђен долазак носе бодове?
              a: Не сами по себи. Бодује се одобрен стварно одрађен рад. Основни бодови су једном по календарском дану у Сарајеву; сати
                се биљеже засебно, а евентуални додатак организације зависи од њене понуде и буџета.
            moves:
              q: Шта ако промијеним комшилук?
              a: Можеш промијенити комшилук за свакодневно коришћење. У овој трци допринос остаје првом комшилуку утврђеном поузданим
                записом за такмичење. Пресељење не пребацује раније бодове, а комшилук позиваоца не одређује комшилук позване особе.
            ties:
              q: Како се рјешава изједначење у трци?
              a: Прво се пореди укупан резултат, затим број бодованих пријава, па број бодованих приједлога. Потпуно изједначење разрјешава
                администратор уз забиљежен разлог. Нема аутоматског жријеба или унапријед обећаног рока од три дана.
            projects:
              q: Ко предлаже и бира пројекат побједничког комшилука?
              a: Фондација отвара посебан процес с јасним роковима и приједлозима. Право гласања провјерава се према потврђеном телефону
                и припадности побједничком комшилуку на пресјеку трке. Рокови се објављују када процес буде спреман; бодови не дају
                додатне гласове.
            closed:
              q: Шта се догађа послије завршетка трке?
              a: Затварање пријема бодованих радњи није проглашење побједника. Тим прегледа резултат и објављује одобрени коначни поредак.
                Бодови трке могу касније бити ручно сакривени; информације о побједнику и пројекту остају.
            privacy:
              q: Да ли анонимна пријава или скривено јавно признање мијењају бодове?
              a: Не. Анонимна пријава значи да контакт не просљеђујемо служби. Ако је поуздано везана за регистрован налог, важе исти
                бодови. Искључење јавног признања скрива појединачно истицање, али не мијења новчаник и трку.
