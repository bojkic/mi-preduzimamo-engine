          no_vote_policy: Бодови заједништва су само знак признања за твој допринос заједници. Немају новчану вриједност и не могу се замијенити за новац. Никада не утичу на гласање, на ранг приједлога нити на то колико је неки приједлог видљив. Твој глас у партиципацији вриједи једнако као и глас сваког другог комшије — без обзира на број бодова.
          earn_title: Како освајаш бодове
          earn_intro: Свака радња има своју вриједност и услове. Табела приказује тренутно важеће бодове и границе броја бодованих радњи.
          volunteer_daily_rule: Потврђен рад доноси %{day_points} основних бодова једном по особи за сваки календарски дан у Сарајеву, без обзира на сате или прилику. Приједлог прилике доноси %{proposal_points} бодова једном за све њене термине. Стварни сати се биљеже; организација може засебно доделити бонус по сату према понуди и расположивом буџету.
          verification_note: Волонтерски рад бодује се након одобрења рада. За позив је довољна регистрација с потврђеним телефоном
            и изабраним комшилуком; додатна објава није услов. Рок и мјесечни лимит вриједе и за такав позив.
          daily_limit:
