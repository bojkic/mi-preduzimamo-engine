      launch:
        messages:
          default_email_subject: МИ ПРЕ(Д)УЗИМАМО!
          p1:
            viber: |
              %{ime}, позивница је твоја.
              Видимо се 17. септембра у Центру за културу. Врата се отварају у 19:00, програм почиње у 20:00.
              Твој број резервације: %{kod} — покажи га на улазу.
              Потврди долазак: %{link}
              Још нешто: фали ти још мало до звања Активиста свог комшилука. И до 14. октобра траје трка — %{komsiluk} се такмичи за 3.000 КМ.
          p3:
            viber: |
              Долазак је потврђен. 17.9, Центар за културу. Врата 19:00, почетак 20:00. Број резервације: %{kod}. Понеси телефон.
              У 19:45 се закључава листа, па дођи раније — у фоајеу има музике, кафе и људи из твог комшилука.
          p4:
            viber: |
              %{ime}, фали ти још %{fali} бодова до позивнице за 17. септембар.
              Најбрже је да пријавиш један проблем у својој улици — фотографија, локација, готово за минут. %{link}
              Остало је још %{ostalo} позивница.
          p5:
            viber: |
              Нових %{broj} позивница за 17. септембар је отворено.
              Услов је исти: региструј се бројем телефона и изабери свој комшилук. %{link}
          p7:
            viber: 'Видимо се вечерас! Центар за културу, врата 19:00, почетак 20:00. Број резервације: %{kod}. Дођи раније, у 19:45 се закључава листа.

              '
          p8:
            viber: 'Хвала што учествујеш у заједници МИ.

              У провјереном прегледу на платформи забиљежено је %{broj} пријава. Сам запис не потврђује да је свака пријава прослијеђена
              служби или ријешена.

              Твој комшилук %{komsiluk} је у трци тренутно %{mjesto}. Два побједничка комшилука — један градски и један сеоски — добијају
              по 3.000 КМ за пројекат који изаберу.

              Актуелни преглед и правила: %{link}'
          p9:
            viber: |
              Трка комшилука, %{datum}
              Твој комшилук %{komsiluk} је %{mjesto}. Остало је још %{broj} дана.
              Град: %{grad_lista}
              Село: %{selo_lista}
              Цијела листа: %{link}
          p10:
            viber: |
              Имамо побједнике.
              Град: %{grad_lista}
              Село: %{selo_lista}
              Сваки добија 3.000 КМ за пројекат у својој средини.
              Шта ће се тачно урадити — бирају сами. Гласање почиње %{datum} на платформи.
              Хвала свима који су пријављивали, предлагали и звали комшије. Коначан поредак: %{link}
          p11:
            email_subject: Од 17. септембра грађани ваше мјесне заједнице пријављују проблеме на платформи МИ
            email: |
              Поштовани/поштована,

              Организатор платформе МИ 17. септембра покреће платформу на којој грађани пријављују проблеме у својој улици, дају приједлоге и прате шта се с њима дешава.

              Пријаве из ваше мјесне заједнице стижу вама. Зато вас молимо за двије ствари:

              1. Отворите налог — треба вам минут и број телефона: %{link}
              2. Одговорите у року од 72 сата, макар само са „примљено, прослијеђено”. То је једино што тражимо. Грађанин који види да је неко прочитао његову пријаву враћа се и сљедећи пут; онај који не види ништа — не враћа се.

              Позивамо вас и на лансирање, 17. септембра у 19:00 у Центру за културу. Молимо да потврдите долазак на %{link}.

              Да не буде неспоразума: ову платформу организује и финансира искључиво њен носилац, ван било које страначке или изборне кампање. Ниједна странка ни кандидат није организатор, партнер ни финансијер, и са бине не говори ниједан носилац јавне функције.

              С поштовањем,
              Тим платформе МИ
