          spend_title: На шта трошиш бодове
          spend_intro: Бодове мијењаш за симболичне награде заједнице.
          spend_policy: Бодови су признање и стање новчаника; немају новчану вриједност, не купују гласове и не утичу на ранг приједлога.
          reward_fulfillment_note: Када преузмеш награду, тим фондације ручно потврђује залихе, величину и термин преузимања прије испоруке.
