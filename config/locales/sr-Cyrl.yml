          period_note: Дан и календарски мјесец рачунају се по времену у Сарајеву. Након лимита можеш наставити да учествујеш, али додатне
            радње у том периоду не доносе личне бодове.
          report_rule: Пријава везана за твој налог носи %{ordinary} бодова; дупликат или потврда „Исти проблем” %{duplicate}; одбијена
            пријава 0. Важи иста скала на сајту и подржаним каналима. Анонимност према служби не умањује бодове. Без поуздане везе с
            регистрованим налогом нема личних бодова. Дупликат и потврда дијеле један добитак по особи и главном проблему и дневни лимит
            пријава.
          referral_rule: Позив преко твог линка доноси %{points} бодова када комшија потврди телефон и изабере комшилук, најраније послије
            %{hours} сата. Највише %{cap} исплаћених позива мјесечно; остали квалификовани чекају наредни мјесец, редом. Комшија у трци
            доприноси свом, а не нужно твом комшилуку.
          visibility_rule: Јавно признање је укључено по почетном подешавању. Можеш га искључити у Мој налог; тада те нема на јавној
            табли и јавним истицањима. То не мијења бодове, награде ни резултат комшилука. Администратори и активни оператери нису у
            појединачном јавном поретку, али могу допринијети трци.
          correction_rule: При прегледу се бодови могу исправити због дупликата, одбијања или уклоњеног садржаја. У историји видиш разлог
            и промјену. Ако би исправка направила негативно стање, тим је прво разматра; новчаник се не спушта испод нуле. Питање или
            приговор пошаљи кроз Контакт уз број пријаве или запис из историје.
          measures_title: Који бодови се гдје рачунају?
          measures:
            wallet: 'Новчаник: бодови расположиви за награде. Трошење и поклони мијењају стање.'
            contribution: 'Допринос: признати допринос за ниво и јавни поредак. Трошење га не умањује; исправке нетачних додјела могу
              га промијенити.'
            season: 'Сезона: преглед доприноса од објављеног датума. Нови сезонски преглед не брише новчаник или укупни допринос.'
            race: 'Трка комшилука: засебан обрачун за комшилук у времену такмичења. Лични бодови нису бодови трке, нити гласови у одлучивању.'
          comparison_title: Лични бодови и трка
          comparison_headers:
